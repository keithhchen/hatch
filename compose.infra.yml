name: hatch-infra

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hatch}
      POSTGRES_USER: ${POSTGRES_USER:-hatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/hatch/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.14.1}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
    name: hatch_postgres_data
  qdrant_data:
    name: hatch_qdrant_data

networks:
  hatch_internal:
    external: true
    name: hatch_internal
