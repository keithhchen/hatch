name: hatch-infra

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hatch}
      POSTGRES_USER: ${POSTGRES_USER:-hatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/hatch/.env}
      POSTGRES_REGISTRY_PASSWORD: ${POSTGRES_REGISTRY_PASSWORD:?set POSTGRES_REGISTRY_PASSWORD in /opt/hatch/.env}
      POSTGRES_FACTORY_PASSWORD: ${POSTGRES_FACTORY_PASSWORD:?set POSTGRES_FACTORY_PASSWORD in /opt/hatch/.env}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD in /opt/hatch/.env}
      POSTGRES_COMMERCE_PASSWORD: ${POSTGRES_COMMERCE_PASSWORD:?set POSTGRES_COMMERCE_PASSWORD in /opt/hatch/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/provision-postgres-roles.sh:/docker-entrypoint-initdb.d/10-hatch-service-roles.sh:ro
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.14.1}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
    name: hatch_postgres_data
  qdrant_data:
    name: hatch_qdrant_data

networks:
  hatch_internal:
    external: true
    name: hatch_internal
