name: hatch-infra

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hatch}
      POSTGRES_USER: ${POSTGRES_USER:-hatch_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/hatch/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.14.1}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  vector:
    image: ${VECTOR_IMAGE:-timberio/vector:0.61.0-alpine}
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      # Vector 0.61 leaves ${VAR} in its config untouched unless told to: the config and the values are both ours.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      HATCH_AXIOM_TOKEN: ${HATCH_AXIOM_TOKEN:-}
      HATCH_AXIOM_DATASET: ${HATCH_AXIOM_DATASET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector

volumes:
  vector_data:
    name: hatch_vector_data
  postgres_data:
    name: hatch_postgres_data
  qdrant_data:
    name: hatch_qdrant_data

networks:
  hatch_internal:
    external: true
    name: hatch_internal
