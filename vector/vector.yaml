# Ships every Hatch container's stdout/stderr to Axiom (dataset HATCH_AXIOM_CONTAINER_DATASET).
data_dir: /var/lib/vector

sources:
  containers:
    type: docker_logs
    include_containers: ["hatch-app-", "hatch-infra-"]

transforms:
  shaped:
    type: remap
    inputs: [containers]
    source: |
      ._time = del(.timestamp)
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        .log = parsed
        del(.message)
      }
      del(.label)
      del(.source_type)

sinks:
  axiom:
    type: http
    inputs: [shaped]
    uri: ${HATCH_AXIOM_ENDPOINT}/v1/ingest/${HATCH_AXIOM_CONTAINER_DATASET}
    method: post
    auth:
      strategy: bearer
      token: ${HATCH_AXIOM_TOKEN}
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        Content-Type: application/x-ndjson
    batch:
      max_bytes: 1048576
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
