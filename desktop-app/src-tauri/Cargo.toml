[package]
name = "hatch-desktop-app"
version = "0.1.11"
edition = "2021"

[lib]
name = "hatch_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
hatch-local-runner = { path = "../../local-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
rfd = "0.15"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", features = ["objc2"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = "0.3.2"
objc2-quick-look-ui = "0.3.2"
quicklook = "0.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
