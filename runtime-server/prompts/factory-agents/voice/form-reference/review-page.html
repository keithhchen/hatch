<!doctype html>
<!--
  REFERENCE PAGE. The server injects Hatch's base CSS before this page, so this is only an HTML
  backbone: no <style> unless the page truly needs something the base classes do not cover.
  The published page is ONE self-contained html file, like this one: script inlined, no external requests.
  Change the title and the data at the top of the script; keep the rest unless the page needs more.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review page</title>
</head>
<body>
<aside class="sidebar" id="side"><nav id="toc" aria-label="Contents"></nav></aside>
<div class="workspace"><main id="main"></main></div>
<div class="actions">
  <div class="error" id="error" role="alert" hidden></div>
  <div class="buttons" id="btns">
    <button class="save" id="save" type="button"></button>
    <button class="submit" id="submit" type="button">Submit</button>
  </div>
  <div class="done" id="done" hidden>Submitted</div>
</div>
<script>
/*
  REFERENCE SCRIPT.
  Only use window.hatch: schema, answers, status, save(id, value), clear(id), submit().
  Replace the EXAMPLE data below with the real content; delete a block you do not need.
  Questions are rendered entirely from hatch.schema, never hard-code them here.
*/

// EXAMPLE placeholder for the "Agent introduction" section. Replace with the real content, or set INTRO = [] to drop the section.
// Each block: { h: subheading, items?: [key points], say?: [what the Agent would say], compare?: { bad, good } }
const INTRO = [
  { h: 'What it does', items: ['(Example) One or two sentences on what this Agent does for the Expert'] },
  { h: 'How it speaks', say: ['(Example) The Agent would say this'], compare: { bad: '(Example) A bad way to say it', good: '(Example) A good way to say it' } },
];

// EXAMPLE placeholder for the "Knowledge gaps" section: what the Agent must ask first, and facts only the Expert can supply. Replace, or set GAPS = [] to drop it.
const GAPS = [
  { h: '(Example) Gap title', items: ['(Example) A fact the Expert needs to supply'] },
];

const hatch = window.hatch;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const NOTE = id => id + '__note';
const questions = hatch.schema.questions;
const sections = [
  INTRO.length && { id: 'intro', title: 'Agent introduction', blocks: INTRO },
  GAPS.length && { id: 'gaps', title: 'Knowledge gaps', blocks: GAPS, count: GAPS.length },
  questions.length && { id: 'questions', title: 'Questions to answer', count: questions.length },
].filter(Boolean);

// One field per stored answer id: { id, read(), write(value), base }. base = last value known to be stored.
const fields = [];
let saving = false, timer = 0, submitted = hatch.status === 'submitted';

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isEmpty = v => v == null || v === '' || (Array.isArray(v) && !v.length);
const pending = () => fields.filter(f => !same(f.read(), f.base));

function showError(message) { $('error').textContent = message || ''; $('error').hidden = !message; }

function refresh() {
  const n = pending().length;
  $('save').disabled = submitted || saving || !n;
  $('save').textContent = saving ? 'Saving…' : n ? `Save (${n} changed)` : 'Saved';
  $('submit').disabled = submitted || saving;
}

// Saves only the changed fields; stops at the first failure and keeps what was typed.
async function saveChanged() {
  clearTimeout(timer);
  if (saving) return false;
  saving = true; showError(''); refresh();
  try {
    for (const f of pending()) {
      const value = f.read();
      if (isEmpty(value)) await hatch.clear(f.id); else await hatch.save(f.id, value);
      f.base = value;
    }
    return true;
  } catch (e) {
    showError(e && e.message ? e.message : 'Saving failed, please try again');
    return false;
  } finally { saving = false; refresh(); }
}

const changed = () => { clearTimeout(timer); timer = setTimeout(saveChanged, 1500); refresh(); };

function textField(id, placeholder) {
  const box = el('textarea');
  box.placeholder = placeholder;
  box.maxLength = 12000;
  box.setAttribute('aria-label', placeholder);
  box.addEventListener('input', changed);
  const f = { id, node: box, read: () => box.value, write: v => { box.value = v || ''; }, base: '' };
  f.write(hatch.answers[id]); f.base = f.read();
  fields.push(f);
  return f;
}

function optionsField(q) {
  const multi = q.type === 'multi';
  const set = el('fieldset', 'options');
  const inputs = (q.options || []).map(opt => {
    const label = el('label', 'option');
    const input = el('input');
    input.type = multi ? 'checkbox' : 'radio';
    input.name = 'q-' + q.id;
    input.value = opt;
    input.addEventListener('change', changed);
    label.append(input, el('span', '', opt));
    set.append(label);
    return input;
  });
  const read = () => multi ? inputs.filter(i => i.checked).map(i => i.value) : (inputs.find(i => i.checked) || {}).value || '';
  const write = v => inputs.forEach(i => { i.checked = multi ? (v || []).includes(i.value) : i.value === v; });
  const f = { id: q.id, node: set, read, write, base: null };
  write(hatch.answers[q.id]); f.base = read();
  fields.push(f);
  return f;
}

function renderQuestion(q) {
  const card = el('article', 'q');
  card.id = q.id;
  const head = el('div', 'q-head');
  head.append(el('span', 'q-id', q.id), el('h3', '', q.title));
  card.append(head);
  if (q.scenario) card.append(el('p', 'scenario', 'Background: ' + q.scenario));
  card.append(el('p', 'prompt', q.prompt));
  const mine = q.type === 'open'
    ? [textField(q.id, 'Write here')]
    : [optionsField(q), textField(NOTE(q.id), 'Additional notes (optional)')];
  mine.forEach(f => card.append(f.node));
  const clear = el('button', 'clear', 'Clear this question');
  clear.type = 'button';
  clear.addEventListener('click', () => { mine.forEach(f => f.write(Array.isArray(f.base) ? [] : '')); changed(); });
  card.append(clear);
  return card;
}

function renderBlocks(blocks) {
  const frag = document.createDocumentFragment();
  for (const b of blocks) {
    const card = el('section', 'paper');
    card.append(el('h3', '', b.h));
    if (b.items) { const ul = el('ul'); b.items.forEach(t => ul.append(el('li', '', t))); card.append(ul); }
    if (b.say) { const p = el('p'); b.say.forEach(t => p.append(el('span', 'say', '「' + t + '」'))); card.append(p); }
    if (b.compare) {
      const row = el('div', 'example');
      const bad = el('div'); bad.append(el('b', '', 'Bad wording'), document.createTextNode(b.compare.bad));
      const good = el('div', 'good'); good.append(el('b', '', 'Good wording'), document.createTextNode(b.compare.good));
      row.append(bad, good); card.append(row);
    }
    frag.append(card);
  }
  return frag;
}

function renderSection(s) {
  const page = el('section'); page.id = s.id; page.hidden = true;
  page.append(el('h1', '', s.title));
  if (s.blocks) { page.append(renderBlocks(s.blocks)); return page; }
  let group = null;
  for (const q of questions) {
    if (q.group && q.group !== group) { group = q.group; page.append(el('h2', '', group)); }
    page.append(renderQuestion(q));
  }
  return page;
}

function show(id) {
  sections.forEach(s => { $(s.id).hidden = s.id !== id; $('tab-' + s.id).classList.toggle('active', s.id === id); });
  $('btns').hidden = submitted || id !== 'questions';
  window.scrollTo(0, 0);
}

function lock() {
  submitted = true;
  document.querySelectorAll('textarea,input').forEach(n => { n.disabled = true; });
  document.querySelectorAll('.clear').forEach(n => n.remove());
  $('btns').hidden = true; showError(''); $('done').hidden = false;
}

async function submit() {
  if (!(await saveChanged())) return;
  $('submit').disabled = true;
  try { await hatch.submit(); lock(); }
  catch (e) { showError(e && e.message ? e.message : 'Submitting failed, please try again'); refresh(); }
}

sections.forEach(s => {
  const tab = el('button', 'nav-link'); tab.type = 'button'; tab.id = 'tab-' + s.id;
  tab.append(el('span', '', s.title));
  if (s.count) tab.append(el('span', 'badge', String(s.count)));
  tab.addEventListener('click', () => show(s.id));
  $('toc').append(tab);
  $('main').append(renderSection(s));
});
$('side').hidden = sections.length < 2;
$('save').addEventListener('click', saveChanged);
$('submit').addEventListener('click', submit);
refresh();
show(sections.length ? sections[0].id : '');
if (submitted) lock();

</script>
</body>
</html>
