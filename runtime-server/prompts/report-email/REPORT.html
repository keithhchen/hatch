<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{product_name}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;">
<tr><td style="padding:32px 28px 8px 28px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:13px;line-height:20px;color:#71717a;">{{product_name}}{{#expert_name}} · {{expert_name}}{{/expert_name}}</td></tr>
<tr><td style="padding:0 28px 8px 28px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:22px;line-height:32px;font-weight:600;color:#18181b;">你的报告已经生成</td></tr>
<tr><td style="padding:0 28px 20px 28px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:15px;line-height:24px;color:#3f3f46;">{{#website}}这是针对 {{website}} 的报告。{{/website}}点下面的按钮在线阅读。</td></tr>
<tr><td align="left" style="padding:0 28px 12px 28px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td align="center" bgcolor="#18181b" style="border-radius:8px;"><a href="{{report_url}}" style="display:inline-block;padding:12px 24px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;">在线查看报告</a></td>
</tr></table>
</td></tr>
<tr><td style="padding:12px 28px 0 28px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:1px solid #e4e4e7;font-size:0;line-height:0;height:1px;">&nbsp;</td></tr></table></td></tr>
<tr><td style="padding:16px 28px 8px 28px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:14px;line-height:22px;color:#52525b;">想继续追问或调整？<a href="{{chat_url}}" style="color:#18181b;font-weight:600;">回到这次对话</a></td></tr>
<tr><td style="padding:8px 28px 28px 28px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:12px;line-height:18px;color:#a1a1aa;">按钮打不开时，复制这个链接到浏览器：<br><span style="word-break:break-all;">{{report_url}}</span></td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;"><tr><td align="center" style="padding:16px 12px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:12px;line-height:18px;color:#a1a1aa;">由 Hatch 发送，因为你在填写 Brief 时留下了这个邮箱。</td></tr></table>
</td></tr>
</table>
</body>
</html>
