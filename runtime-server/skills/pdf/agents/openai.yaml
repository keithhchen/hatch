interface:
  display_name: PDF
  short_description: Inspect, transform, create, and visually verify PDF files.
  default_prompt: Create, edit, or review this PDF and summarize the key output or changes.
policy:
  allow_implicit_invocation: true
  products: []
dependencies:
  tools:
    - type: runtime
      value: python
      description: Bundled Hatch Python runtime exposed as HATCH_PYTHON.
    - type: runtime
      value: node
      description: Bundled Hatch Node runtime exposed as HATCH_NODE.
