name: Hatch Web CI and CD

on:
  push:
    branches: [master, codex/web-ui-overhaul]
    paths:
      - "creator-dashboard/**"
      - "packages/ui/**"
      - "packages/brand/**"
      - "packages/commerce/**"
      - "Dockerfile.dashboard"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hatch-web-production
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            creator-dashboard/package-lock.json
            packages/ui/package-lock.json
      - name: Install and test shared UI
        working-directory: packages/ui
        run: |
          npm ci
          npm test
      - name: Install, test, and build Dashboard
        working-directory: creator-dashboard
        env:
          HATCH_OSS_PUBLIC_BASE_URL: ${{ vars.HATCH_OSS_PUBLIC_BASE_URL }}
          VITE_HATCH_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.HATCH_DESKTOP_DOWNLOAD_BASE_URL }}
          VITE_HATCH_WEB_MEDIA_BASE_URL: ${{ vars.HATCH_OSS_PUBLIC_BASE_URL }}/desktop/web/${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HATCH_OSS_PUBLIC_BASE_URL" || {
            echo "Missing HATCH_OSS_PUBLIC_BASE_URL repository variable" >&2
            exit 1
          }
          test -n "$VITE_HATCH_DESKTOP_DOWNLOAD_BASE_URL" || {
            echo "Missing HATCH_DESKTOP_DOWNLOAD_BASE_URL repository variable" >&2
            exit 1
          }
          test -n "$VITE_HATCH_WEB_MEDIA_BASE_URL" || {
            echo "Missing Web OSS media base URL" >&2
            exit 1
          }
          printf '%s' "$HATCH_OSS_PUBLIC_BASE_URL" | grep -Eq '^https://'
          printf '%s' "$VITE_HATCH_WEB_MEDIA_BASE_URL" | grep -Eq '^https://'
          expected_download_base="${HATCH_OSS_PUBLIC_BASE_URL%/}/desktop/latest"
          test "${VITE_HATCH_DESKTOP_DOWNLOAD_BASE_URL%/}" = "$expected_download_base" || {
            echo "HATCH_DESKTOP_DOWNLOAD_BASE_URL must equal HATCH_OSS_PUBLIC_BASE_URL/desktop/latest" >&2
            exit 1
          }
          npm ci
          npm test
          npm run build
          npm run build-storybook
      - uses: docker/setup-buildx-action@v3
      - name: Build Dashboard container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: hatch-dashboard:web-ci
          build-args: |
            VITE_HATCH_DESKTOP_DOWNLOAD_BASE_URL=${{ vars.HATCH_DESKTOP_DOWNLOAD_BASE_URL }}
            VITE_HATCH_WEB_MEDIA_BASE_URL=${{ vars.HATCH_OSS_PUBLIC_BASE_URL }}/desktop/web/${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  publish-web-media:
    name: Publish Web media to OSS
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HATCH_OSS_BUCKET: ${{ vars.HATCH_OSS_BUCKET }}
      HATCH_OSS_REGION: ${{ vars.HATCH_OSS_REGION }}
      HATCH_OSS_S3_ENDPOINT: ${{ vars.HATCH_OSS_S3_ENDPOINT }}
      HATCH_OSS_PUBLIC_BASE_URL: ${{ vars.HATCH_OSS_PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HATCH_OSS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HATCH_OSS_ACCESS_KEY_SECRET }}
      AWS_DEFAULT_REGION: ${{ vars.HATCH_OSS_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      # The existing release-only RAM policy is scoped to desktop/*; keep
      # Web media in its own child prefix without widening that policy.
      WEB_MEDIA_PREFIX: desktop/web/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate OSS publication configuration
        run: |
          set -euo pipefail
          test -n "$HATCH_OSS_BUCKET"
          test -n "$HATCH_OSS_REGION"
          test -n "$HATCH_OSS_S3_ENDPOINT"
          test -n "$HATCH_OSS_PUBLIC_BASE_URL"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          printf '%s' "$HATCH_OSS_S3_ENDPOINT" | grep -Eq '^https://'
          printf '%s' "$HATCH_OSS_PUBLIC_BASE_URL" | grep -Eq '^https://'
          command -v aws >/dev/null
      - name: Upload and verify Web videos
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style virtual
          endpoint=(--endpoint-url "$HATCH_OSS_S3_ENDPOINT")
          set_public_read_acl() {
            local object_key="$1"
            aws s3api put-object-acl \
              --bucket "$HATCH_OSS_BUCKET" \
              --key "$object_key" \
              --acl public-read \
              "${endpoint[@]}"
          }
          for locale in en ja zh; do
            source="creator-dashboard/public/assets/web/hatch-launch-${locale}.mp4"
            key="${WEB_MEDIA_PREFIX}/hatch-launch-${locale}.mp4"
            expected_bytes="$(wc -c < "$source" | tr -d '[:space:]')"
            aws s3 cp "$source" "s3://${HATCH_OSS_BUCKET}/${key}" "${endpoint[@]}" \
              --acl public-read \
              --cache-control "public,max-age=31536000,immutable" \
              --content-type "video/mp4" \
              --metadata "source-sha=${GITHUB_SHA},bytes=${expected_bytes}"
            set_public_read_acl "$key"
            head_json="$(aws s3api head-object --bucket "$HATCH_OSS_BUCKET" --key "$key" "${endpoint[@]}")"
            jq -e --argjson bytes "$expected_bytes" \
              '.ContentLength == $bytes and .ContentType == "video/mp4"' <<<"$head_json" >/dev/null
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              -r 0-1 "${HATCH_OSS_PUBLIC_BASE_URL%/}/${key}" -o /dev/null
          done

  publish:
    name: Publish Dashboard image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable image reference
        id: image
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/$repository/dashboard:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            VITE_HATCH_DESKTOP_DOWNLOAD_BASE_URL=${{ vars.HATCH_DESKTOP_DOWNLOAD_BASE_URL }}
            VITE_HATCH_WEB_MEDIA_BASE_URL=${{ vars.HATCH_OSS_PUBLIC_BASE_URL }}/desktop/web/${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  deploy:
    name: Deploy Web only
    needs: [publish, publish-web-media]
    runs-on: [self-hosted, linux, x64, hatch-prod]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Materialize GitHub production environment
        env:
          HATCH_PRODUCTION_ENV: ${{ secrets.HATCH_PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          test -n "$HATCH_PRODUCTION_ENV"
          temp_env="$(mktemp /opt/hatch/.env.github.XXXXXX)"
          trap 'rm -f "$temp_env"' EXIT
          umask 077
          printf '%s\n' "$HATCH_PRODUCTION_ENV" > "$temp_env"
          test -s "$temp_env"
          grep -Eq '^HATCH_DOMAIN=[^[:space:]]+$' "$temp_env"
          chmod 600 "$temp_env"
          mv -f "$temp_env" /opt/hatch/.env
          trap - EXIT
      - name: Inspect production Docker host
        run: |
          set -u
          uname -a
          df -h / /var/lib/docker || true
          df -i / /var/lib/docker || true
          docker version || true
          docker info --format 'server={{.ServerVersion}} storage={{.Driver}} root={{.DockerRootDir}}' || true
          docker system df || true
      - name: Replace only the Dashboard container
        env:
          DASHBOARD_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HATCH_DOMAIN: ${{ vars.HATCH_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$HATCH_DOMAIN"
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          previous_image="$(docker inspect --format '{{.Config.Image}}' hatch-app-dashboard-1)"
          override="$(mktemp)"
          printf 'services:\n  dashboard:\n    image: ${HATCH_DASHBOARD_IMAGE}\n' > "$override"
          compose=(docker compose --env-file /opt/hatch/.env --env-file /opt/hatch/.release.env -f /opt/hatch/compose.app.yml -f "$override")
          # Remove only dangling layers. Tagged release images remain available
          # for rollback, while interrupted pulls cannot accumulate forever.
          docker image prune -f >/dev/null 2>&1 || true
          pulled=0
          for attempt in 1 2 3; do
            echo "Pulling dashboard image (attempt $attempt/3)"
            if timeout 300s docker pull --platform linux/amd64 "$DASHBOARD_IMAGE"; then
              pulled=1
              break
            fi
            docker system df || true
            sleep $((attempt * 10))
          done
          if test "$pulled" != 1; then
            echo "Dashboard image pull timed out or failed; leaving the current container in place." >&2
            exit 1
          fi
          if ! timeout 180s env HATCH_DASHBOARD_IMAGE="$DASHBOARD_IMAGE" "${compose[@]}" up -d --no-deps --pull never dashboard; then
            HATCH_DASHBOARD_IMAGE="$previous_image" "${compose[@]}" up -d --no-deps dashboard
            exit 1
          fi
          explore_probe="$(mktemp)"
          if ! curl -4 --noproxy '*' --connect-timeout 10 --max-time 30 --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/health/dashboard" >/dev/null \
            || ! curl -4 --noproxy '*' --connect-timeout 10 --max-time 30 --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/explore" -o "$explore_probe" \
            || ! grep -F 'src="/assets/' "$explore_probe" >/dev/null; then
            rm -f "$explore_probe"
            HATCH_DASHBOARD_IMAGE="$previous_image" "${compose[@]}" up -d --no-deps dashboard
            exit 1
          fi
          rm -f "$explore_probe"
          rm -f "$override"
