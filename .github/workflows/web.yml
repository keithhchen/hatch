name: Hatch Web CI and CD

on:
  push:
    branches: [master, codex/web-ui-overhaul]
    paths:
      - "creator-dashboard/**"
      - "packages/ui/**"
      - "packages/brand/**"
      - "packages/commerce/**"
      - "Dockerfile.dashboard"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hatch-web-production
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            creator-dashboard/package-lock.json
            packages/ui/package-lock.json
      - name: Install and test shared UI
        working-directory: packages/ui
        run: |
          npm ci
          npm test
      - name: Install, test, and build Dashboard
        working-directory: creator-dashboard
        run: |
          npm ci
          npm test
          npm run build
          npm run build-storybook
      - uses: docker/setup-buildx-action@v3
      - name: Build Dashboard container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: hatch-dashboard:web-ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  publish:
    name: Publish Dashboard image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable image reference
        id: image
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/$repository/dashboard:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  deploy:
    name: Deploy Web only
    needs: publish
    runs-on: [self-hosted, linux, x64, hatch-prod]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect production Docker host
        run: |
          set -u
          uname -a
          df -h / /var/lib/docker || true
          df -i / /var/lib/docker || true
          docker version || true
          docker info --format 'server={{.ServerVersion}} storage={{.Driver}} root={{.DockerRootDir}}' || true
          docker system df || true
      - name: Replace only the Dashboard container
        env:
          DASHBOARD_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          previous_image="$(docker inspect --format '{{.Config.Image}}' hatch-app-dashboard-1)"
          override="$(mktemp)"
          printf 'services:\n  dashboard:\n    image: ${HATCH_DASHBOARD_IMAGE}\n' > "$override"
          compose=(docker compose --env-file /opt/hatch/.env --env-file /opt/hatch/.release.env -f /opt/hatch/compose.app.yml -f "$override")
          # Remove only dangling layers. Tagged release images remain available
          # for rollback, while interrupted pulls cannot accumulate forever.
          docker image prune -f >/dev/null 2>&1 || true
          pulled=0
          for attempt in 1 2 3; do
            echo "Pulling dashboard image (attempt $attempt/3)"
            if timeout 300s docker pull --platform linux/amd64 "$DASHBOARD_IMAGE"; then
              pulled=1
              break
            fi
            docker system df || true
            sleep $((attempt * 10))
          done
          if test "$pulled" != 1; then
            echo "Dashboard image pull timed out or failed; leaving the current container in place." >&2
            exit 1
          fi
          if ! timeout 180s env HATCH_DASHBOARD_IMAGE="$DASHBOARD_IMAGE" "${compose[@]}" up -d --no-deps --pull never dashboard; then
            HATCH_DASHBOARD_IMAGE="$previous_image" "${compose[@]}" up -d --no-deps dashboard
            exit 1
          fi
          domain="$(sed -n 's/^HATCH_DOMAIN=//p' /opt/hatch/.env | tail -n 1)"
          if ! curl -4 --noproxy '*' --connect-timeout 10 --max-time 30 --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/health/dashboard" >/dev/null \
            || ! curl -4 --noproxy '*' --connect-timeout 10 --max-time 30 --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/explore" | grep -q 'src="/assets/'; then
            HATCH_DASHBOARD_IMAGE="$previous_image" "${compose[@]}" up -d --no-deps dashboard
            exit 1
          fi
          rm -f "$override"
