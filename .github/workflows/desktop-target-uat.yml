name: Hatch Desktop target-device UAT

# This workflow is intentionally manual and bound to protected Environments.
# It consumes one exact CI artifact; it never rebuilds a candidate package and
# it does not use distribution-signing or persistent-session credentials.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target UAT platform
        required: true
        type: choice
        options: [macos, windows]
      source_run_id:
        description: Hatch CI run ID that uploaded the candidate artifact
        required: true
        type: string
      source_sha:
        description: Exact source.git_sha from that candidate's CI JSON report
        required: true
        type: string
      expected_sha256:
        description: Exact package.sha256 from that candidate's CI JSON report
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  macos:
    name: macOS target-device candidate UAT
    if: inputs.platform == 'macos'
    # Provision this interactive, dedicated runner before enabling the
    # environment. It must be an arm64 macOS desktop whose screen may be
    # captured and which contains no production account or user data.
    runs-on: [self-hosted, macos, arm64]
    environment: desktop-uat-macos
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify a candidate with the protected default-branch helper, not
          # executable code from the candidate commit.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download immutable macOS candidate and CI report
        uses: actions/download-artifact@v4
        with:
          name: hatch-desktop-macos-arm64-ad-hoc-uat
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate report, source, and package hash
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          report_path="$(find candidate -type f -name macos.json -print -quit)"
          test -n "$report_path"
          node scripts/uat/verify-desktop-uat-artifact.mjs \
            --platform macos \
            --report "$report_path" \
            --artifact-dir candidate \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-runner-architecture "$RUNNER_ARCH" \
            --expected-sha256 "$EXPECTED_SHA256" | tee evidence/package-verification.json
      - name: Mount, copy-install, cold launch, screenshot, and collect logs
        run: |
          set -euo pipefail
          uat_root="$(mktemp -d "$RUNNER_TEMP/hatch-target-uat.XXXXXX")"
          mount_path="$uat_root/mount"
          applications_path="$uat_root/Applications"
          mkdir -p "$mount_path" "$applications_path"
          dmg_path="$(find candidate -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          app_pid=""
          cleanup() {
            if [ -n "$app_pid" ] && kill -0 "$app_pid" 2>/dev/null; then kill "$app_pid" || true; fi
            hdiutil detach "$mount_path" -quiet 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"
          test -d "$mount_path/Hatch.app"
          ditto "$mount_path/Hatch.app" "$applications_path/Hatch.app"
          codesign --verify --deep --strict "$applications_path/Hatch.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$applications_path/Hatch.app/Contents/Info.plist")"
          # A candidate may be untrusted. Do not pass GitHub Actions or other
          # workflow credentials into the launched application process.
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            TMPDIR="${TMPDIR:-/tmp}" \
            LANG="${LANG:-en_US.UTF-8}" \
            "$applications_path/Hatch.app/Contents/MacOS/$executable" > evidence/app.stdout.log 2> evidence/app.stderr.log &
          app_pid="$!"
          sleep 8
          kill -0 "$app_pid"
          screencapture -x evidence/cold-launch.png
          test -s evidence/cold-launch.png
          log show --style compact --last 2m --predicate "process == '$executable'" > evidence/macos-system.log || true
      - name: Upload target-device macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatch-target-uat-macos-${{ inputs.source_run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Windows target-device candidate UAT
    if: inputs.platform == 'windows'
    # Provision this interactive, dedicated runner before enabling the
    # environment. It must be a real Windows desktop that permits screenshots
    # and contains no production account or user data.
    runs-on: [self-hosted, windows, x64]
    environment: desktop-uat-windows
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify a candidate with the protected default-branch helper, not
          # executable code from the candidate commit.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download immutable Windows candidate and CI report
        uses: actions/download-artifact@v4
        with:
          name: hatch-desktop-windows-unsigned
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate report, source, and package hash
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $report = Get-ChildItem candidate -Recurse -File -Filter windows.json | Select-Object -First 1 -ExpandProperty FullName
          if (-not $report) { throw "Downloaded artifact did not contain windows.json." }
          node scripts/uat/verify-desktop-uat-artifact.mjs `
            --platform windows `
            --report $report `
            --artifact-dir candidate `
            --expected-source-sha $env:EXPECTED_SOURCE_SHA `
            --expected-runner-architecture $env:RUNNER_ARCH `
            --expected-sha256 $env:EXPECTED_SHA256 | Tee-Object -FilePath evidence/package-verification.json
      - name: Silent install, cold launch, screenshot, and collect process evidence
        run: |
          $uatRoot = Join-Path $env:RUNNER_TEMP "hatch-target-uat-$env:GITHUB_RUN_ID"
          $installRoot = Join-Path $uatRoot "installed"
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          $installer = Get-ChildItem candidate -Recurse -File -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Downloaded artifact did not contain a Windows installer." }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)." }
          $app = Get-ChildItem $installRoot -Recurse -File -Filter Hatch.exe | Select-Object -First 1
          if (-not $app) { throw "Silent install did not produce Hatch.exe." }
          $stdout = Join-Path (Resolve-Path evidence) "app.stdout.log"
          $stderr = Join-Path (Resolve-Path evidence) "app.stderr.log"
          # A candidate may be untrusted. Strip CI credential-like variables
          # only while spawning it, then restore the workflow environment.
          $savedEnvironment = @{}
          Get-ChildItem Env: | Where-Object { $_.Name -match '(^GITHUB_|^ACTIONS_|TOKEN|SECRET|PASSWORD|PRIVATE_KEY)' } | ForEach-Object {
            $savedEnvironment[$_.Name] = $_.Value
            Remove-Item -LiteralPath "Env:$($_.Name)"
          }
          try {
            $process = Start-Process -FilePath $app.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } finally {
            foreach ($entry in $savedEnvironment.GetEnumerator()) {
              Set-Item -LiteralPath "Env:$($entry.Key)" -Value $entry.Value
            }
          }
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) { throw "Hatch exited during cold launch with code $($process.ExitCode)." }
            Get-Process -Id $process.Id | Select-Object Id, ProcessName, StartTime, Path | ConvertTo-Json | Set-Content evidence/process.json
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path (Resolve-Path evidence) "cold-launch.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
            if (-not (Test-Path evidence/cold-launch.png)) { throw "Interactive runner did not produce a screenshot." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload target-device Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatch-target-uat-windows-${{ inputs.source_run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
