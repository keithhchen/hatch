name: Hatch application CD

on:
  workflow_run:
    workflows: ["Hatch CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: hatch-production
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Runtime and Registry
        working-directory: runtime-server
        run: |
          npm ci
          npm test
      - name: Verify cross-process Commerce ledger
        working-directory: packages/commerce
        run: npm test
      - name: Verify Creator Dashboard
        working-directory: creator-dashboard
        run: |
          npm ci
          npm test
          npm run build

  build-and-push:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'master'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    needs: verify-server
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        id: image
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Runtime/Registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ${{ steps.image.outputs.prefix }}/runtime:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ steps.image.outputs.prefix }}/dashboard:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: ${{ steps.image.outputs.prefix }}/caddy:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  deploy:
    runs-on: [self-hosted, linux, x64, hatch-prod]
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source through GitHub API
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          archive="$temp_dir/source.tgz"
          curl -4 --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$RELEASE_TAG" \
            -o "$archive"
          root_dir="$(tar -tzf "$archive" | sed -n '1s#/.*##p')"
          test -n "$root_dir"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          tar -xzf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/$root_dir/." "$GITHUB_WORKSPACE/"
          rm -rf "$temp_dir"
      - name: Prepare application definition
        env:
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          install -m 640 compose.app.yml /opt/hatch/
          install -m 640 compose.infra.yml /opt/hatch/
      - name: Install LLM provider credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.HATCH_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          sed -i '/^DEEPSEEK_API_KEY=/d' /opt/hatch/.env
          printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY" >> /opt/hatch/.env
          chmod 600 /opt/hatch/.env
      - name: Ensure deployment service token
        run: |
          set -euo pipefail
          cd /opt/hatch
          test -f .env
          token="$(sed -n 's/^HATCH_REGISTRY_DEPLOYMENT_SERVICE_TOKEN=//p' .env | tail -n 1)"
          if test -z "$token"; then
            token="$(openssl rand -hex 32)"
            sed -i '/^HATCH_REGISTRY_DEPLOYMENT_SERVICE_TOKEN=/d' .env
            printf 'HATCH_REGISTRY_DEPLOYMENT_SERVICE_TOKEN=%s\n' "$token" >> .env
            chmod 600 .env
          fi
          printf '%s' "$token" | grep -Eq '^[a-f0-9]{64}$' || {
            echo "HATCH_REGISTRY_DEPLOYMENT_SERVICE_TOKEN must be 64 lowercase hexadecimal characters" >&2
            exit 1
          }
      - name: Ensure Runtime-to-Commerce service token
        run: |
          set -euo pipefail
          cd /opt/hatch
          test -f .env
          token="$(sed -n 's/^HATCH_COMMERCE_RUNTIME_SERVICE_TOKEN=//p' .env | tail -n 1)"
          if test -z "$token"; then
            token="$(openssl rand -hex 32)"
            sed -i '/^HATCH_COMMERCE_RUNTIME_SERVICE_TOKEN=/d' .env
            printf 'HATCH_COMMERCE_RUNTIME_SERVICE_TOKEN=%s\n' "$token" >> .env
            chmod 600 .env
          fi
          printf '%s' "$token" | grep -Eq '^[a-f0-9]{64}$' || {
            echo "HATCH_COMMERCE_RUNTIME_SERVICE_TOKEN must be 64 lowercase hexadecimal characters" >&2
            exit 1
          }
      - name: Ensure shared Postgres is ready
        run: |
          set -euo pipefail
          cd /opt/hatch
          test -f .env
          test -f compose.infra.yml
          if ! grep -Eq '^HATCH_DATABASE_URL=[^[:space:]]+' .env; then
            database_url="$(sed -n 's/^HATCH_REGISTRY_DATABASE_URL=//p' .env | tail -n 1)"
            test -n "$database_url" || { echo "Missing HATCH_DATABASE_URL in /opt/hatch/.env" >&2; exit 1; }
            printf 'HATCH_DATABASE_URL=%s\n' "$database_url" >> .env
            chmod 600 .env
          fi
          postgres_user="$(sed -n 's/^POSTGRES_USER=//p' .env | tail -n 1)"
          postgres_database="$(sed -n 's/^POSTGRES_DB=//p' .env | tail -n 1)"
          postgres_user="${postgres_user:-hatch}"
          postgres_database="${postgres_database:-hatch}"
          for identifier in "$postgres_user" "$postgres_database"; do
            printf '%s' "$identifier" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || {
              echo "POSTGRES_USER and POSTGRES_DB must be simple SQL identifiers" >&2
              exit 1
            }
          done
          infra=(docker compose --env-file .env -f compose.infra.yml)
          "${infra[@]}" up -d postgres
          postgres_ready=0
          for _attempt in $(seq 1 30); do
            if "${infra[@]}" exec -T postgres pg_isready -U "$postgres_user" -d "$postgres_database" >/dev/null 2>&1; then
              postgres_ready=1
              break
            fi
            sleep 2
          done
          test "$postgres_ready" = 1 || { echo "Postgres did not become ready" >&2; exit 1; }
      - name: Pull and switch application containers
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd /opt/hatch
          test -f .env
          test -f compose.app.yml
          grep -q '^HATCH_DOMAIN=' .env
          for key in LLM_API_KEY DEEPSEEK_API_KEY HATCH_DATABASE_URL HATCH_REGISTRY_PUBLISH_SERVICE_TOKEN HATCH_REGISTRY_RUNTIME_SERVICE_TOKEN HATCH_REGISTRY_COMMERCE_SERVICE_TOKEN HATCH_REGISTRY_DEPLOYMENT_SERVICE_TOKEN HATCH_COMMERCE_RUNTIME_SERVICE_TOKEN DASHSCOPE_API_KEY POSTGRES_PASSWORD; do
            grep -Eq "^${key}=[^[:space:]]+" .env || { echo "Missing non-empty $key in /opt/hatch/.env"; exit 1; }
          done
          payment_mode="$(sed -n 's/^HATCH_COMMERCE_PAYMENT_MODE=//p' .env | tail -n 1)"
          payment_mode="${payment_mode:-disabled}"
          case "$payment_mode" in
            disabled) ;;
            provider)
              for key in HATCH_PAYMENT_PROVIDER_BASE_URL HATCH_PAYMENT_PROVIDER_API_TOKEN HATCH_PAYMENT_PROVIDER_WEBHOOK_SECRET; do
                grep -Eq "^${key}=[^[:space:]]+" .env || { echo "Provider payment mode requires non-empty $key in /opt/hatch/.env"; exit 1; }
              done
              paid_launch_approved="$(sed -n 's/^HATCH_COMMERCE_PAID_LAUNCH_APPROVED=//p' .env | tail -n 1)"
              test "$paid_launch_approved" = "true" || {
                echo "Provider payment mode requires HATCH_COMMERCE_PAID_LAUNCH_APPROVED=true after merchant, tax, region, refund, payout, and reserve policy approval"
                exit 1
              }
              payout_schedule="$(sed -n 's/^HATCH_PAYOUT_SCHEDULE=//p' .env | tail -n 1)"
              payout_minimum="$(sed -n 's/^HATCH_PAYOUT_MINIMUM_MINOR=//p' .env | tail -n 1)"
              test "$payout_schedule" = "immediate" || {
                echo "Provider payment mode requires the explicitly approved HATCH_PAYOUT_SCHEDULE=immediate policy"
                exit 1
              }
              printf '%s' "$payout_minimum" | grep -Eq '^[1-9][0-9]*$' || {
                echo "Provider payment mode requires a positive HATCH_PAYOUT_MINIMUM_MINOR policy"
                exit 1
              }
              ;;
            *)
              echo "Production HATCH_COMMERCE_PAYMENT_MODE must be disabled or provider"
              exit 1
              ;;
          esac
          docker network inspect hatch_internal >/dev/null
          if test -f .release.env; then
            cp -f .release.env .release.env.previous
          fi
          printf 'HATCH_IMAGE_PREFIX=%s\nHATCH_RELEASE_TAG=%s\n' "$IMAGE_PREFIX" "$RELEASE_TAG" > .release.env
          compose=(docker compose --env-file .env --env-file .release.env -f compose.app.yml)
          if ! "${compose[@]}" up -d --no-deps registry factory-worker runtime dashboard caddy; then
            "${compose[@]}" ps -a
            for service in registry dashboard runtime factory-worker; do
              echo "--- $service container logs (last 80 lines) ---" >&2
              "${compose[@]}" logs --no-color --tail=80 "$service" >&2 || true
            done
            exit 1
          fi
          if ! "${compose[@]}" ps --status running --services | grep -Fxq factory-worker; then
            "${compose[@]}" ps -a
            for service in registry dashboard runtime factory-worker; do
              echo "--- $service container logs (last 80 lines) ---" >&2
              "${compose[@]}" logs --no-color --tail=80 "$service" >&2 || true
            done
            exit 1
          fi
      - name: Seed canonical Agent Corpus and RAG index
        env:
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/hatch-demo-agent /tmp/hatch-demo-agent.zip
          node scripts/bootstrap-demo-corpus.mjs /tmp/hatch-demo-agent
          runtime_image="${IMAGE_PREFIX}/runtime:${RELEASE_TAG}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v /tmp/hatch-demo-agent:/input:ro -v /tmp:/output \
            "$runtime_image" node scripts/create-agent-zip.mjs /input /output/hatch-demo-agent.zip
          registry_token="$(grep '^HATCH_REGISTRY_PUBLISH_SERVICE_TOKEN=' /opt/hatch/.env | cut -d= -f2-)"
          compose=(docker compose --env-file /opt/hatch/.env --env-file /opt/hatch/.release.env -f "$GITHUB_WORKSPACE/compose.app.yml")
          registry_request_once() {
            local method="$1" path="$2" token="$3" body="${4:-}" extra_headers="${5:-{}}"
            "${compose[@]}" exec -T \
              -e HATCH_REQUEST_METHOD="$method" \
              -e HATCH_REQUEST_PATH="$path" \
              -e HATCH_REQUEST_TOKEN="$token" \
              -e HATCH_REQUEST_BODY="$body" \
              -e HATCH_REQUEST_EXTRA_HEADERS="$extra_headers" \
              registry node --input-type=module -e '
                const body = process.env.HATCH_REQUEST_BODY || undefined;
                const headers = { authorization: `Bearer ${process.env.HATCH_REQUEST_TOKEN}` };
                Object.assign(headers, JSON.parse(process.env.HATCH_REQUEST_EXTRA_HEADERS || "{}"));
                if (body !== undefined) headers["content-type"] = "application/json";
                const response = await fetch(`http://127.0.0.1:8100${process.env.HATCH_REQUEST_PATH}`, {
                  method: process.env.HATCH_REQUEST_METHOD,
                  headers,
                  body
                });
                const text = await response.text();
                if (!response.ok) {
                  process.stderr.write(text);
                  process.exit(1);
                }
                process.stdout.write(text);
              '
          }
          registry_request() {
            local attempt
            for attempt in $(seq 1 12); do
              if registry_request_once "$@"; then return 0; fi
              sleep 3
            done
            return 1
          }
          registry_publish_once() {
            local archive="$1" creator_id="$2" product_id="$3"
            "${compose[@]}" exec -T \
              -e HATCH_REQUEST_TOKEN="$registry_token" \
              -e HATCH_CREATOR_ID="$creator_id" \
              -e HATCH_PRODUCT_ID="$product_id" \
              registry node --input-type=module -e '
                const chunks = [];
                for await (const chunk of process.stdin) chunks.push(chunk);
                const query = new URLSearchParams({ creator_id: process.env.HATCH_CREATOR_ID, product_id: process.env.HATCH_PRODUCT_ID });
                const response = await fetch(`http://127.0.0.1:8100/v1/product-corpora?${query}`, {
                  method: "POST",
                  headers: {
                    authorization: `Bearer ${process.env.HATCH_REQUEST_TOKEN}`,
                    "content-type": "application/zip"
                  },
                  body: Buffer.concat(chunks)
                });
                const text = await response.text();
                if (!response.ok) {
                  process.stderr.write(text);
                  process.exit(1);
                }
                process.stdout.write(text);
              ' < "$archive"
          }
          registry_publish() {
            local attempt
            for attempt in $(seq 1 12); do
              if registry_publish_once "$@"; then return 0; fi
              sleep 3
            done
            return 1
          }
          registry_publish /tmp/hatch-demo-agent.zip 6f6a3d24-48af-4f27-9c50-0d4f7e4e8a21 f9c4e2b7-7d14-4d72-9a63-1e91e58d6c42
          rm -rf /tmp/hatch-seth-agent /tmp/hatch-seth-agent.zip
          runtime_image="${IMAGE_PREFIX}/runtime:${RELEASE_TAG}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/creators/seth/agent-corpus:/input:ro" -v /tmp:/output \
            "$runtime_image" node scripts/create-agent-zip.mjs /input /output/hatch-seth-agent.zip
          registry_publish /tmp/hatch-seth-agent.zip 32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b 026651b1-8a8a-4484-aac5-ace6bd662157
          runtime_token="$(grep '^HATCH_REGISTRY_RUNTIME_SERVICE_TOKEN=' /opt/hatch/.env | cut -d= -f2-)"
          seed="$GITHUB_WORKSPACE/creators/seth/control-plane-bindings.json"
          secret="$(jq -r '.secret' "$seed")"
          while IFS= read -r encoded; do
            connection="$(printf '%s' "$encoded" | base64 --decode)"
            connection_id="$(printf '%s' "$connection" | jq -r '.id')"
            config="$(printf '%s' "$connection" | jq -c '.config')"
            registry_request PUT \
              "/v1/control-plane/connections/$connection_id" \
              "$runtime_token" \
              "$(jq -cn --arg secret "$secret" --argjson config "$config" '{kind:"http", secret_ref:null, secret:$secret, config:$config, status:"active"}')" \
              '{"X-Hatch-Tenant-Id":"32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b"}' >/dev/null
          done < <(jq -r '.connections[] | @base64' "$seed")
          while IFS= read -r encoded; do
            connection="$(printf '%s' "$encoded" | base64 --decode)"
            tool_id="$(printf '%s' "$connection" | jq -r '.tool_id')"
            connection_id="$(printf '%s' "$connection" | jq -r '.id')"
            registry_request PUT \
              "/v1/creators/32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b/products/026651b1-8a8a-4484-aac5-ace6bd662157/tools/$(printf '%s' "$tool_id" | jq -sRr @uri)" \
              "$runtime_token" \
              "$(jq -cn --arg connection_id "$connection_id" '{connection_id:$connection_id}')" \
              '{"X-Hatch-Creator-Id":"32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b"}' >/dev/null
          done < <(jq -r '.connections[] | @base64' "$seed")
      - name: Verify public health endpoints
        env:
          HATCH_DOMAIN: ${{ vars.HATCH_DOMAIN }}
        run: |
          set -euo pipefail
          domain="${HATCH_DOMAIN:-$(grep '^HATCH_DOMAIN=' /opt/hatch/.env | cut -d= -f2-)}"
          test -n "$domain"
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/health/dashboard" >/dev/null
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/health/runtime" >/dev/null
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/health/registry" >/dev/null
          curl -4 --noproxy '*' --fail --location --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/explore" >/dev/null
          logout_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$domain/v1/auth/logout")"
          test "$logout_status" = 204
          me_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' "https://$domain/v1/auth/me")"
          test "$me_status" = 401
          public_grant_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$domain/v1/user/products/probe/access")"
          test "$public_grant_status" = 404
          private_grant_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$domain/v1/commerce/product-access")"
          test "$private_grant_status" = 404
      - name: Roll back application release when health fails
        if: failure()
        run: |
          set -euo pipefail
          cd /opt/hatch
          if test -f .release.env.previous; then
            cp .release.env.previous .release.env
            docker compose --env-file .env --env-file .release.env -f compose.app.yml up -d --no-deps registry factory-worker runtime dashboard caddy
            docker compose --env-file .env --env-file .release.env -f compose.app.yml ps --status running --services | grep -Fxq factory-worker
            domain="$(grep '^HATCH_DOMAIN=' .env | cut -d= -f2-)"
            test -n "$domain"
            curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/health/dashboard" >/dev/null
            curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/health/runtime" >/dev/null
            curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/health/registry" >/dev/null
          else
            # A first release has no known-good image to restore. Do not leave
            # an unverified stack serving traffic or let its tag become the
            # previous release on the next attempt.
            docker compose --env-file .env --env-file .release.env -f compose.app.yml stop caddy dashboard runtime factory-worker registry
            rm -f .release.env
          fi
