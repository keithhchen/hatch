name: Hatch application CD

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64, hatch-prod]
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - name: Checkout source through GitHub API
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          archive="$temp_dir/source.tgz"
          curl -4 --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$archive"
          root_dir="$(tar -tzf "$archive" | sed -n '1s#/.*##p')"
          test -n "$root_dir"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          tar -xzf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/$root_dir/." "$GITHUB_WORKSPACE/"
          rm -rf "$temp_dir"
      - name: Normalize image name
        id: image
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Runtime/Registry image
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.prefix }}/runtime:${RELEASE_TAG}"
          docker build -f Dockerfile.runtime -t "$image" .
          docker push "$image"
      - name: Push Dashboard image
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.prefix }}/dashboard:${RELEASE_TAG}"
          docker build -f Dockerfile.dashboard -t "$image" .
          docker push "$image"
      - name: Push Caddy image
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.prefix }}/caddy:${RELEASE_TAG}"
          docker build -f Dockerfile.caddy -t "$image" .
          docker push "$image"

  deploy:
    runs-on: [self-hosted, linux, x64, hatch-prod]
    needs: build-and-push
    steps:
      - name: Checkout source through GitHub API
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          archive="$temp_dir/source.tgz"
          curl -4 --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$archive"
          root_dir="$(tar -tzf "$archive" | sed -n '1s#/.*##p')"
          test -n "$root_dir"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          tar -xzf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/$root_dir/." "$GITHUB_WORKSPACE/"
          rm -rf "$temp_dir"
      - name: Prepare application definition
        run: |
          set -euo pipefail
          install -m 640 compose.app.yml /opt/hatch/
          mkdir -p /opt/hatch/dashboard
          if test ! -f /opt/hatch/dashboard/product-catalog.json; then
            install -m 640 docs/proof/creator-dashboard-clean-catalog-v1/product-catalog.json /opt/hatch/dashboard/product-catalog.json
          fi
      - name: Pull and switch application containers
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd /opt/hatch
          test -f .env
          test -f compose.app.yml
          grep -q '^HATCH_DOMAIN=' .env
          for key in LLM_API_KEY HATCH_REGISTRY_DATABASE_URL HATCH_REGISTRY_PUBLISH_SERVICE_TOKEN HATCH_REGISTRY_RUNTIME_SERVICE_TOKEN HATCH_AUTH_SIGNING_SECRET DASHSCOPE_API_KEY POSTGRES_PASSWORD; do
            grep -Eq "^${key}=[^[:space:]]+" .env || { echo "Missing non-empty $key in /opt/hatch/.env"; exit 1; }
          done
          docker network inspect hatch_internal >/dev/null
          if test -f .release.env; then
            cp -f .release.env .release.env.previous
          fi
          printf 'HATCH_IMAGE_PREFIX=%s\nHATCH_RELEASE_TAG=%s\n' "$IMAGE_PREFIX" "$RELEASE_TAG" > .release.env
          docker compose --env-file .env --env-file .release.env -f compose.app.yml up -d --no-deps registry runtime dashboard caddy
      - name: Seed canonical Agent Corpus and RAG index
        env:
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/hatch-demo-agent /tmp/hatch-demo-agent.zip
          node scripts/bootstrap-demo-corpus.mjs /tmp/hatch-demo-agent
          runtime_image="${IMAGE_PREFIX}/runtime:${RELEASE_TAG}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v /tmp/hatch-demo-agent:/input:ro -v /tmp:/output \
            "$runtime_image" node scripts/create-agent-zip.mjs /input /output/hatch-demo-agent.zip
          domain="$(grep '^HATCH_DOMAIN=' /opt/hatch/.env | cut -d= -f2-)"
          registry_token="$(grep '^HATCH_REGISTRY_PUBLISH_SERVICE_TOKEN=' /opt/hatch/.env | cut -d= -f2-)"
          if curl -4 --noproxy '*' --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 3 \
            "https://$domain/v1/agent-corpora/maya-chen/signal-resume-review" >/dev/null; then
            echo "Signal Resume Review Agent Corpus already published"
          else
            curl -4 --noproxy '*' --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 3 \
              -H "Authorization: Bearer $registry_token" \
              -H "Content-Type: application/zip" \
              --data-binary @/tmp/hatch-demo-agent.zip \
              "https://$domain/v1/agent-corpora?creator_id=maya-chen&agent_id=signal-resume-review"
          fi
      - name: Verify public health endpoints
        env:
          HATCH_DOMAIN: ${{ vars.HATCH_DOMAIN }}
        run: |
          set -euo pipefail
          domain="${HATCH_DOMAIN:-$(grep '^HATCH_DOMAIN=' /opt/hatch/.env | cut -d= -f2-)}"
          test -n "$domain"
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/healthz" >/dev/null
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/api/health" >/dev/null
      - name: Roll back application release when health fails
        if: failure()
        run: |
          set -euo pipefail
          cd /opt/hatch
          if test -f .release.env.previous; then
            cp .release.env.previous .release.env
            docker compose --env-file .env --env-file .release.env -f compose.app.yml up -d --no-deps registry runtime dashboard caddy
          fi
