name: Hatch application CD

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ github.sha }}

concurrency:
  group: hatch-cloud-deployment
  cancel-in-progress: true

jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Runtime and Registry
        working-directory: runtime-server
        run: |
          npm ci
          npm test
      - name: Verify cross-process Commerce ledger
        working-directory: packages/commerce
        run: npm test
      - name: Verify Creator Dashboard
        working-directory: creator-dashboard
        run: |
          npm ci
          npm test
          npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: verify-server
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        id: image
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Runtime/Registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ${{ steps.image.outputs.prefix }}/runtime:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ steps.image.outputs.prefix }}/dashboard:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: ${{ steps.image.outputs.prefix }}/caddy:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  deploy:
    runs-on: [self-hosted, linux, x64, hatch-prod]
    needs: build-and-push
    steps:
      - name: Checkout source through GitHub API
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          archive="$temp_dir/source.tgz"
          curl -4 --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$archive"
          root_dir="$(tar -tzf "$archive" | sed -n '1s#/.*##p')"
          test -n "$root_dir"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          tar -xzf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/$root_dir/." "$GITHUB_WORKSPACE/"
          rm -rf "$temp_dir"
      - name: Prepare application definition
        env:
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          install -m 640 compose.app.yml /opt/hatch/
          install -m 640 compose.infra.yml /opt/hatch/
      - name: Install LLM provider credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.HATCH_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          sed -i '/^DEEPSEEK_API_KEY=/d' /opt/hatch/.env
          printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY" >> /opt/hatch/.env
          chmod 600 /opt/hatch/.env
      - name: Provision isolated Runtime Postgres role
        run: |
          set -euo pipefail
          cd /opt/hatch
          test -f .env
          test -f compose.infra.yml
          runtime_db_password="$(sed -n 's/^HATCH_RUNTIME_DB_PASSWORD=//p' .env | tail -n 1)"
          if test -z "$runtime_db_password"; then
            runtime_db_password="$(openssl rand -hex 32)"
            sed -i '/^HATCH_RUNTIME_DB_PASSWORD=/d' .env
            printf 'HATCH_RUNTIME_DB_PASSWORD=%s\n' "$runtime_db_password" >> .env
            chmod 600 .env
          fi
          printf '%s' "$runtime_db_password" | grep -Eq '^[a-f0-9]{64}$' || {
            echo "HATCH_RUNTIME_DB_PASSWORD must be exactly 64 lowercase hexadecimal characters" >&2
            exit 1
          }
          postgres_user="$(sed -n 's/^POSTGRES_USER=//p' .env | tail -n 1)"
          postgres_database="$(sed -n 's/^POSTGRES_DB=//p' .env | tail -n 1)"
          postgres_user="${postgres_user:-hatch}"
          postgres_database="${postgres_database:-hatch}"
          for identifier in "$postgres_user" "$postgres_database"; do
            printf '%s' "$identifier" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || {
              echo "POSTGRES_USER and POSTGRES_DB must be simple SQL identifiers" >&2
              exit 1
            }
          done
          infra=(docker compose --env-file .env -f compose.infra.yml)
          "${infra[@]}" up -d postgres
          postgres_ready=0
          for _attempt in $(seq 1 30); do
            if "${infra[@]}" exec -T postgres pg_isready -U "$postgres_user" -d "$postgres_database" >/dev/null 2>&1; then
              postgres_ready=1
              break
            fi
            sleep 2
          done
          test "$postgres_ready" = 1 || { echo "Postgres did not become ready for Runtime role provisioning" >&2; exit 1; }
          {
            printf "SELECT format('CREATE ROLE hatch_runtime LOGIN PASSWORD %%L', '%s') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='hatch_runtime') \\gexec\n" "$runtime_db_password"
            printf "SELECT format('ALTER ROLE hatch_runtime LOGIN PASSWORD %%L', '%s') \\gexec\n" "$runtime_db_password"
            printf 'CREATE SCHEMA IF NOT EXISTS hatch_runtime AUTHORIZATION hatch_runtime;\n'
            printf 'ALTER SCHEMA hatch_runtime OWNER TO hatch_runtime;\n'
            printf 'REVOKE CREATE ON SCHEMA public FROM PUBLIC;\n'
            printf 'DO $hatch$ BEGIN IF to_regclass('\''public.hatch_conversation_events'\'') IS NOT NULL AND to_regclass('\''hatch_runtime.hatch_conversation_events'\'') IS NULL THEN EXECUTE '\''ALTER TABLE public.hatch_conversation_events SET SCHEMA hatch_runtime'\''; END IF; END $hatch$;\n'
            printf 'ALTER TABLE IF EXISTS hatch_runtime.hatch_conversation_events OWNER TO hatch_runtime;\n'
            printf 'ALTER SEQUENCE IF EXISTS hatch_runtime.hatch_conversation_events_id_seq OWNER TO hatch_runtime;\n'
            printf 'ALTER ROLE hatch_runtime IN DATABASE "%s" SET search_path TO hatch_runtime, pg_catalog;\n' "$postgres_database"
          } | "${infra[@]}" exec -T postgres psql -q -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_database"
      - name: Pull and switch application containers
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd /opt/hatch
          test -f .env
          test -f compose.app.yml
          grep -q '^HATCH_DOMAIN=' .env
          for key in LLM_API_KEY DEEPSEEK_API_KEY HATCH_REGISTRY_DATABASE_URL HATCH_RUNTIME_DB_PASSWORD HATCH_REGISTRY_PUBLISH_SERVICE_TOKEN HATCH_REGISTRY_RUNTIME_SERVICE_TOKEN HATCH_REGISTRY_COMMERCE_SERVICE_TOKEN DASHSCOPE_API_KEY POSTGRES_PASSWORD; do
            grep -Eq "^${key}=[^[:space:]]+" .env || { echo "Missing non-empty $key in /opt/hatch/.env"; exit 1; }
          done
          docker network inspect hatch_internal >/dev/null
          if test -f .release.env; then
            cp -f .release.env .release.env.previous
          fi
          printf 'HATCH_IMAGE_PREFIX=%s\nHATCH_RELEASE_TAG=%s\n' "$IMAGE_PREFIX" "$RELEASE_TAG" > .release.env
          docker compose --env-file .env --env-file .release.env -f compose.app.yml up -d --no-deps registry runtime dashboard caddy
      - name: Seed canonical Agent Corpus and RAG index
        env:
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/hatch-demo-agent /tmp/hatch-demo-agent.zip
          node scripts/bootstrap-demo-corpus.mjs /tmp/hatch-demo-agent
          runtime_image="${IMAGE_PREFIX}/runtime:${RELEASE_TAG}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v /tmp/hatch-demo-agent:/input:ro -v /tmp:/output \
            "$runtime_image" node scripts/create-agent-zip.mjs /input /output/hatch-demo-agent.zip
          domain="$(grep '^HATCH_DOMAIN=' /opt/hatch/.env | cut -d= -f2-)"
          registry_token="$(grep '^HATCH_REGISTRY_PUBLISH_SERVICE_TOKEN=' /opt/hatch/.env | cut -d= -f2-)"
          curl -4 --noproxy '*' --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $registry_token" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/hatch-demo-agent.zip \
            "https://$domain/v1/agent-corpora?creator_id=maya-chen&agent_id=signal-resume-review"
          rm -rf /tmp/hatch-seth-agent /tmp/hatch-seth-agent.zip
          runtime_image="${IMAGE_PREFIX}/runtime:${RELEASE_TAG}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/creators/seth/agent-corpus:/input:ro" -v /tmp:/output \
            "$runtime_image" node scripts/create-agent-zip.mjs /input /output/hatch-seth-agent.zip
          curl -4 --noproxy '*' --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $registry_token" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/hatch-seth-agent.zip \
            "https://$domain/v1/agent-corpora?creator_id=seth&agent_id=alpha-lite"
          runtime_token="$(grep '^HATCH_REGISTRY_RUNTIME_SERVICE_TOKEN=' /opt/hatch/.env | cut -d= -f2-)"
          seed="$GITHUB_WORKSPACE/creators/seth/control-plane-bindings.json"
          secret="$(jq -r '.secret' "$seed")"
          while IFS= read -r encoded; do
            connection="$(printf '%s' "$encoded" | base64 --decode)"
            connection_id="$(printf '%s' "$connection" | jq -r '.id')"
            config="$(printf '%s' "$connection" | jq -c '.config')"
            curl -4 --noproxy '*' --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 3 \
              -X PUT "https://$domain/v1/control-plane/connections/$connection_id" \
              -H "Authorization: Bearer $runtime_token" -H "X-Hatch-Tenant-Id: seth" -H "Content-Type: application/json" \
              --data "$(jq -cn --arg secret "$secret" --argjson config "$config" '{kind:"http", secret_ref:null, secret:$secret, config:$config, status:"active"}')" >/dev/null
          done < <(jq -r '.connections[] | @base64' "$seed")
          while IFS= read -r encoded; do
            connection="$(printf '%s' "$encoded" | base64 --decode)"
            tool_id="$(printf '%s' "$connection" | jq -r '.tool_id')"
            connection_id="$(printf '%s' "$connection" | jq -r '.id')"
            curl -4 --noproxy '*' --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 3 \
              -X PUT "https://$domain/v1/creators/seth/agents/alpha-lite/tools/$(printf '%s' "$tool_id" | jq -sRr @uri)" \
              -H "Authorization: Bearer $runtime_token" -H "X-Hatch-Creator-Id: seth" -H "Content-Type: application/json" \
              --data "$(jq -cn --arg connection_id "$connection_id" '{connection_id:$connection_id}')" >/dev/null
          done < <(jq -r '.connections[] | @base64' "$seed")
      - name: Verify public health endpoints
        env:
          HATCH_DOMAIN: ${{ vars.HATCH_DOMAIN }}
        run: |
          set -euo pipefail
          domain="${HATCH_DOMAIN:-$(grep '^HATCH_DOMAIN=' /opt/hatch/.env | cut -d= -f2-)}"
          test -n "$domain"
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/healthz" >/dev/null
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/api/health" >/dev/null
          curl -4 --noproxy '*' --fail --location --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$domain/agents" >/dev/null
          logout_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$domain/v1/auth/logout")"
          test "$logout_status" = 204
          me_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' "https://$domain/v1/auth/me")"
          test "$me_status" = 401
          public_grant_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$domain/v1/user/agents/probe/probe/access")"
          test "$public_grant_status" = 404
          private_grant_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$domain/v1/commerce/agent-access")"
          test "$private_grant_status" = 404
      - name: Roll back application release when health fails
        if: failure()
        run: |
          set -euo pipefail
          cd /opt/hatch
          if test -f .release.env.previous; then
            cp .release.env.previous .release.env
            docker compose --env-file .env --env-file .release.env -f compose.app.yml up -d --no-deps registry runtime dashboard caddy
          fi
