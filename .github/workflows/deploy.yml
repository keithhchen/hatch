name: Hatch application CD

on:
  workflow_run:
    workflows: ["Hatch Web CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Immutable master commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hatch-production
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}

jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify immutable master commit
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_TAG" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "$RELEASE_TAG" origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Runtime and Registry
        working-directory: runtime-server
        run: |
          npm ci
          npm test
      - name: Verify cross-process Commerce ledger
        working-directory: packages/commerce
        run: npm test
      - name: Install shared UI dependencies
        working-directory: packages/ui
        run: npm ci
      - name: Verify Creator Dashboard
        working-directory: creator-dashboard
        run: |
          npm ci
          npm test
          npm run build

  build-and-push:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && github.event.workflow_run.head_branch == 'master'
              && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    needs: verify-server
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Normalize image name
        id: image
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Runtime/Registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ${{ steps.image.outputs.prefix }}/runtime:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      # Dashboard publishing and rollout live in web.yml. Keeping the image
      # out of this application CD prevents a backend release from silently
      # replacing the separately verified Web surface.
      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: ${{ steps.image.outputs.prefix }}/caddy:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  deploy:
    runs-on: [self-hosted, linux, x64, hatch-prod]
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source through GitHub API
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          archive="$temp_dir/source.tgz"
          curl -4 --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$RELEASE_TAG" \
            -o "$archive"
          root_dir="$(tar -tzf "$archive" | sed -n '1s#/.*##p')"
          test -n "$root_dir"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          tar -xzf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/$root_dir/." "$GITHUB_WORKSPACE/"
          rm -rf "$temp_dir"
      - name: Materialize GitHub production environment
        env:
          HATCH_PRODUCTION_ENV: ${{ secrets.HATCH_PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          test -n "$HATCH_PRODUCTION_ENV"
          temp_env="$(mktemp /opt/hatch/.env.github.XXXXXX)"
          trap 'rm -f "$temp_env"' EXIT
          umask 077
          printf '%s\n' "$HATCH_PRODUCTION_ENV" > "$temp_env"
          test -s "$temp_env"
          grep -Eq '^HATCH_DOMAIN=[^[:space:]]+$' "$temp_env"
          chmod 600 "$temp_env"
          mv -f "$temp_env" /opt/hatch/.env
          trap - EXIT
      - name: Prepare application definition
        env:
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if test -f /opt/hatch/compose.app.yml; then
            cp -f /opt/hatch/compose.app.yml /opt/hatch/compose.app.yml.previous
          fi
          install -m 640 compose.app.yml /opt/hatch/
          install -m 640 compose.infra.yml /opt/hatch/
      - name: Ensure shared Postgres is ready
        run: |
          set -euo pipefail
          cd /opt/hatch
          test -f .env
          test -f compose.infra.yml
          grep -Eq '^HATCH_DATABASE_URL=[^[:space:]]+' .env || { echo "Missing HATCH_DATABASE_URL in GitHub production environment" >&2; exit 1; }
          postgres_user="$(sed -n 's/^POSTGRES_USER=//p' .env | tail -n 1)"
          postgres_database="$(sed -n 's/^POSTGRES_DB=//p' .env | tail -n 1)"
          postgres_user="${postgres_user:-hatch}"
          postgres_database="${postgres_database:-hatch}"
          for identifier in "$postgres_user" "$postgres_database"; do
            printf '%s' "$identifier" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || {
              echo "POSTGRES_USER and POSTGRES_DB must be simple SQL identifiers" >&2
              exit 1
            }
          done
          infra=(docker compose --env-file .env -f compose.infra.yml)
          "${infra[@]}" up -d postgres
          postgres_ready=0
          for _attempt in $(seq 1 30); do
            if "${infra[@]}" exec -T postgres pg_isready -U "$postgres_user" -d "$postgres_database" >/dev/null 2>&1; then
              postgres_ready=1
              break
            fi
            sleep 2
          done
          test "$postgres_ready" = 1 || { echo "Postgres did not become ready" >&2; exit 1; }
      - name: Pull and switch application containers
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd /opt/hatch
          test -f .env
          test -f compose.app.yml
          grep -q '^HATCH_DOMAIN=' .env
          for key in LLM_API_KEY HATCH_DATABASE_URL HATCH_REGISTRY_PUBLISH_SERVICE_TOKEN HATCH_REGISTRY_RUNTIME_SERVICE_TOKEN HATCH_REGISTRY_DEPLOYMENT_SERVICE_TOKEN HATCH_COMMERCE_RUNTIME_SERVICE_TOKEN HATCH_OAUTH_STATE_KEY DASHSCOPE_API_KEY POSTGRES_PASSWORD; do
            grep -Eq "^${key}=[^[:space:]]+" .env || { echo "Missing non-empty $key in /opt/hatch/.env"; exit 1; }
          done
          factory_profile="$(sed -n 's/^HATCH_FACTORY_LLM_PROFILE=//p' .env | tail -n 1)"
          factory_profile="${factory_profile:-kimi-k2.6}"
          case "$factory_profile" in
            kimi-k2.6|deepseek-v4-flash) ;;
            *) echo "Unsupported HATCH_FACTORY_LLM_PROFILE=$factory_profile" >&2; exit 1 ;;
          esac
          payment_mode="$(sed -n 's/^HATCH_COMMERCE_PAYMENT_MODE=//p' .env | tail -n 1)"
          payment_mode="${payment_mode:-disabled}"
          case "$payment_mode" in
            disabled) ;;
            provider)
              for key in HATCH_PAYMENT_PROVIDER_BASE_URL HATCH_PAYMENT_PROVIDER_API_TOKEN HATCH_PAYMENT_PROVIDER_WEBHOOK_SECRET; do
                grep -Eq "^${key}=[^[:space:]]+" .env || { echo "Provider payment mode requires non-empty $key in /opt/hatch/.env"; exit 1; }
              done
              paid_launch_approved="$(sed -n 's/^HATCH_COMMERCE_PAID_LAUNCH_APPROVED=//p' .env | tail -n 1)"
              test "$paid_launch_approved" = "true" || {
                echo "Provider payment mode requires HATCH_COMMERCE_PAID_LAUNCH_APPROVED=true after merchant, tax, region, refund, payout, and reserve policy approval"
                exit 1
              }
              payout_schedule="$(sed -n 's/^HATCH_PAYOUT_SCHEDULE=//p' .env | tail -n 1)"
              payout_minimum="$(sed -n 's/^HATCH_PAYOUT_MINIMUM_MINOR=//p' .env | tail -n 1)"
              test "$payout_schedule" = "immediate" || {
                echo "Provider payment mode requires the explicitly approved HATCH_PAYOUT_SCHEDULE=immediate policy"
                exit 1
              }
              printf '%s' "$payout_minimum" | grep -Eq '^[1-9][0-9]*$' || {
                echo "Provider payment mode requires a positive HATCH_PAYOUT_MINIMUM_MINOR policy"
                exit 1
              }
              ;;
            *)
              echo "Production HATCH_COMMERCE_PAYMENT_MODE must be disabled or provider"
              exit 1
              ;;
          esac
          docker network inspect hatch_internal >/dev/null
          df -h / /var/lib/docker || true
          df -i / /var/lib/docker || true
          docker info --format 'server={{.ServerVersion}} storage={{.Driver}} root={{.DockerRootDir}}' || true
          docker system df || true
          docker image prune -f >/dev/null 2>&1 || true
          if test -f .release.env; then
            cp -f .release.env .release.env.previous
          fi
          printf 'HATCH_IMAGE_PREFIX=%s\nHATCH_RELEASE_TAG=%s\n' "$IMAGE_PREFIX" "$RELEASE_TAG" > .release.env
          compose=(docker compose --env-file .env --env-file .release.env -f compose.app.yml)
          pull_image() {
            local image="$1"
            local label="$2"
            local attempt
            for attempt in 1 2; do
              echo "Pulling $label image (attempt $attempt/2)"
              # Pull the shared Runtime image once, before Compose resolves
              # registry and runtime concurrently. The production runner is
              # bandwidth-constrained and Compose can leave the duplicate
              # service in an "already being pulled" state until its timeout.
              if timeout 900s docker pull "$image"; then
                return 0
              fi
              docker system df || true
              sleep $((attempt * 10))
            done
            echo "$label image pull timed out or failed." >&2
            return 1
          }
          pull_image "$IMAGE_PREFIX/runtime:$RELEASE_TAG" Runtime
          pull_image "$IMAGE_PREFIX/caddy:$RELEASE_TAG" Caddy
          # Always recreate the release-tagged services. A self-hosted runner
          # can retain a container created from an older tag; reusing it would
          # silently leave one production surface behind the release.
          # The retired Factory worker is intentionally not started. Remove
          # any container left by an older release before bringing up the
          # Node-based Registry.
          docker ps -aq --filter label=com.docker.compose.service=factory-worker | xargs -r docker rm -f
          if ! timeout 180s "${compose[@]}" up -d --no-deps --pull never --force-recreate registry runtime caddy; then
            "${compose[@]}" ps -a
            for service in registry dashboard runtime; do
              echo "--- $service container logs (last 80 lines) ---" >&2
              "${compose[@]}" logs --no-color --tail=80 "$service" >&2 || true
            done
            exit 1
          fi
          if ! "${compose[@]}" ps --status running --services | grep -Fxq registry; then
            "${compose[@]}" ps -a
            for service in registry dashboard runtime; do
              echo "--- $service container logs (last 80 lines) ---" >&2
              "${compose[@]}" logs --no-color --tail=80 "$service" >&2 || true
            done
            exit 1
          fi
          # The deployed Factory Node profile must be usable from the
          # actual Registry network, not merely present in /opt/hatch/.env. A
          # metadata-only probe catches missing/blocked provider credentials
          # before a Creator can enqueue a Run that will fail opaquely later.
          factory_profile="$(sed -n 's/^HATCH_FACTORY_LLM_PROFILE=//p' .env | tail -n 1)"
          factory_profile="${factory_profile:-kimi-k2.6}"
          if test "$factory_profile" = "deepseek-v4-flash"; then
            grep -Eq '^DEEPSEEK_API_KEY=[^[:space:]]+' .env || { echo "DeepSeek profile requires non-empty DEEPSEEK_API_KEY in /opt/hatch/.env"; exit 1; }
            "${compose[@]}" exec -T registry node --input-type=module -e '
              const key = process.env.DEEPSEEK_API_KEY?.trim();
              if (!key) {
                console.error("DeepSeek credential is missing inside registry");
                process.exit(1);
              }
              const response = await fetch("https://api.deepseek.com/models", {
                headers: { authorization: `Bearer ${key}` }
              });
              console.log(`DeepSeek models probe: ${response.status}`);
              if (!response.ok) process.exit(1);
            '
          elif test "$factory_profile" = "kimi-k2.6"; then
            "${compose[@]}" exec -T registry node --input-type=module -e '
              const key = process.env.LLM_API_KEY?.trim();
              if (!key) {
                console.error("Kimi credential is missing inside registry");
                process.exit(1);
              }
              const response = await fetch("https://api.moonshot.cn/v1/models", {
                headers: { authorization: `Bearer ${key}` }
              });
              console.log(`Kimi models probe: ${response.status}`);
              if (!response.ok) process.exit(1);
            '
          fi
      - name: Seed canonical Agent Corpus and RAG index
        env:
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          compose=(docker compose --env-file /opt/hatch/.env --env-file /opt/hatch/.release.env -f "$GITHUB_WORKSPACE/compose.app.yml")
          registry_request_once() {
            # Keep the optional header argument empty when omitted; the Node
            # helper supplies the JSON empty object.  `${5:-{}}` is parsed by
            # bash with an extra closing brace and produces invalid JSON.
            local method="$1" path="$2" token="$3" body="${4:-}" extra_headers="${5:-}"
            "${compose[@]}" exec -T \
              -e HATCH_REQUEST_METHOD="$method" \
              -e HATCH_REQUEST_PATH="$path" \
              -e HATCH_REQUEST_TOKEN="$token" \
              -e HATCH_REQUEST_BODY="$body" \
              -e HATCH_REQUEST_EXTRA_HEADERS="$extra_headers" \
              registry node --input-type=module -e '
                const body = process.env.HATCH_REQUEST_BODY || undefined;
                const headers = { authorization: `Bearer ${process.env.HATCH_REQUEST_TOKEN}` };
                Object.assign(headers, JSON.parse(process.env.HATCH_REQUEST_EXTRA_HEADERS || "{}"));
                if (body !== undefined) headers["content-type"] = "application/json";
                const response = await fetch(`http://127.0.0.1:8100${process.env.HATCH_REQUEST_PATH}`, {
                  method: process.env.HATCH_REQUEST_METHOD,
                  headers,
                  body
                });
                const text = await response.text();
                if (!response.ok) {
                  process.stderr.write(text);
                  process.exit(1);
                }
                process.stdout.write(text);
              '
          }
          registry_request() {
            local attempt
            for attempt in $(seq 1 12); do
              if registry_request_once "$@"; then return 0; fi
              sleep 3
            done
            return 1
          }
          runtime_token="$(grep '^HATCH_REGISTRY_RUNTIME_SERVICE_TOKEN=' /opt/hatch/.env | cut -d= -f2-)"
          seed="$GITHUB_WORKSPACE/creators/seth/control-plane-bindings.json"
          secret="$(jq -r '.secret' "$seed")"
          while IFS= read -r encoded; do
            connection="$(printf '%s' "$encoded" | base64 --decode)"
            connection_id="$(printf '%s' "$connection" | jq -r '.id')"
            config="$(printf '%s' "$connection" | jq -c '.config')"
            registry_request PUT \
              "/v1/control-plane/connections/$connection_id" \
              "$runtime_token" \
              "$(jq -cn --arg secret "$secret" --argjson config "$config" '{kind:"http", secret_ref:null, secret:$secret, config:$config, status:"active"}')" \
              '{"X-Hatch-Tenant-Id":"32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b"}' >/dev/null
          done < <(jq -r '.connections[] | @base64' "$seed")
          while IFS= read -r encoded; do
            connection="$(printf '%s' "$encoded" | base64 --decode)"
            tool_id="$(printf '%s' "$connection" | jq -r '.tool_id')"
            connection_id="$(printf '%s' "$connection" | jq -r '.id')"
            registry_request PUT \
              "/v1/creators/32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b/products/026651b1-8a8a-4484-aac5-ace6bd662157/tools/$(printf '%s' "$tool_id" | jq -sRr @uri)" \
              "$runtime_token" \
              "$(jq -cn --arg connection_id "$connection_id" '{connection_id:$connection_id}')" \
              '{"X-Hatch-Creator-Id":"32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b"}' >/dev/null
          done < <(jq -r '.connections[] | @base64' "$seed")
      - name: Verify public health endpoints
        env:
          HATCH_DOMAIN: ${{ vars.HATCH_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$HATCH_DOMAIN"
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/health/dashboard" >/dev/null
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/health/runtime" >/dev/null
          curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/health/registry" >/dev/null
          curl -4 --noproxy '*' --fail --location --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/explore" >/dev/null
          product_json="$(curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/v1/public/products/026651b1-8a8a-4484-aac5-ace6bd662157")"
          printf '%s' "$product_json" | jq -e '
            .product.product_id == "026651b1-8a8a-4484-aac5-ace6bd662157"
            and .product.availability == "published"
            and .product.available == true
            and ((.product.offer // null) == null)
          ' >/dev/null
          logout_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$HATCH_DOMAIN/v1/auth/logout")"
          test "$logout_status" = 204
          me_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' "https://$HATCH_DOMAIN/v1/auth/me")"
          test "$me_status" = 401
          public_grant_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$HATCH_DOMAIN/v1/user/products/probe/access")"
          test "$public_grant_status" = 404
          private_grant_status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' -X POST "https://$HATCH_DOMAIN/v1/commerce/product-access")"
          test "$private_grant_status" = 404
      - name: Roll back application release when health fails
        if: failure()
        env:
          HATCH_DOMAIN: ${{ vars.HATCH_DOMAIN }}
        run: |
          set -euo pipefail
          cd /opt/hatch
          if test -f .release.env.previous; then
            if test -f compose.app.yml.previous; then
              cp -f compose.app.yml.previous compose.app.yml
            fi
            cp .release.env.previous .release.env
            docker ps -aq --filter label=com.docker.compose.service=factory-worker | xargs -r docker rm -f
            docker compose --env-file .env --env-file .release.env -f compose.app.yml up -d --no-deps registry runtime caddy
            docker compose --env-file .env --env-file .release.env -f compose.app.yml ps --status running --services | grep -Fxq registry
            test -n "$HATCH_DOMAIN"
            curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/health/dashboard" >/dev/null
            curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/health/runtime" >/dev/null
            curl -4 --noproxy '*' --fail --retry 12 --retry-all-errors --retry-delay 3 --silent "https://$HATCH_DOMAIN/health/registry" >/dev/null
          else
            # A first release has no known-good image to restore. Do not leave
            # an unverified stack serving traffic or let its tag become the
            # previous release on the next attempt.
            docker ps -aq --filter label=com.docker.compose.service=factory-worker | xargs -r docker rm -f
            docker compose --env-file .env --env-file .release.env -f compose.app.yml stop caddy runtime registry
            rm -f .release.env
          fi
