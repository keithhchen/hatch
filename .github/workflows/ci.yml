name: Hatch CI

on:
  pull_request:
  push:
    branches: [master]
  # This is the reproducible, non-production package lane for cross-platform UAT.
  # It is deliberately separate from the protected signed-release workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce:
    name: Commerce ledger tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test cross-process ledger invariants
        run: npm test

  runtime:
    name: Runtime and Registry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test

  dashboard:
    name: Creator Dashboard tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: creator-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build portal
        run: npm run build

  desktop-renderer:
    name: Desktop renderer tests and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test renderer
        run: npm run test:renderer
      - name: Build renderer
        run: npm run build:web
      - name: Test desktop UAT evidence helpers
        working-directory: .
        run: node --test scripts/uat/*.test.mjs

  desktop-native:
    name: Desktop native, LocalRunner, and macOS UAT package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install renderer dependencies
        working-directory: desktop-app
        run: npm ci
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path local-runner/Cargo.toml -- --check
          cargo fmt --manifest-path desktop-app/src-tauri/Cargo.toml -- --check
      - name: Test renderer and web build on macOS
        working-directory: desktop-app
        run: |
          npm run test:renderer
          npm run build:web
      - name: Test LocalRunner
        run: cargo test --locked --manifest-path local-runner/Cargo.toml
      - name: Test Tauri bridge
        run: cargo test --locked --manifest-path desktop-app/src-tauri/Cargo.toml
      - name: Build ad-hoc macOS DMG for target-device UAT
        working-directory: desktop-app
        env:
          # The UAT lane intentionally proves that its artifact cannot enable
          # persistent credential storage. Signed distribution is handled only
          # by desktop-release.yml in the protected environment.
          HATCH_PERSISTENT_SESSION: "0"
        run: npm run build:dmg:ci
      - name: Record macOS automated UAT evidence
        env:
          HATCH_PERSISTENT_SESSION: "0"
        run: >-
          node scripts/uat/record-desktop-uat-artifact.mjs
          --platform macos
          --artifact-dir desktop-app/src-tauri/target/release/bundle/dmg
          --output artifacts/desktop-uat/macos.json
      - name: Upload ad-hoc macOS UAT package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: hatch-desktop-macos-ad-hoc-uat
          path: |
            desktop-app/src-tauri/target/release/bundle/dmg/*.dmg
            artifacts/desktop-uat/macos.json
          if-no-files-found: error
          retention-days: 7

  desktop-native-windows:
    name: Desktop native bridge on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install renderer dependencies
        working-directory: desktop-app
        run: npm ci
      - name: Test renderer and web build
        working-directory: desktop-app
        run: |
          npm run test:renderer
          npm run build:web
      - name: Test LocalRunner on Windows
        run: cargo test --locked --manifest-path local-runner/Cargo.toml
      - name: Test Tauri bridge on Windows
        run: cargo test --locked --manifest-path desktop-app/src-tauri/Cargo.toml
      - name: Build unsigned Windows NSIS bundle
        working-directory: desktop-app
        env:
          # Windows persistence is intentionally fail-closed until a
          # device-bound session backend exists; CI must never exercise a
          # vault-backed bearer-token path.
          HATCH_PERSISTENT_SESSION: "0"
        run: npx tauri build --debug --bundles nsis
      - name: Record Windows automated UAT evidence
        shell: bash
        env:
          HATCH_PERSISTENT_SESSION: "0"
        run: >-
          node scripts/uat/record-desktop-uat-artifact.mjs
          --platform windows
          --artifact-dir desktop-app/src-tauri/target/debug/bundle/nsis
          --output artifacts/desktop-uat/windows.json
      - name: Upload unsigned Windows installer for UAT
        uses: actions/upload-artifact@v4
        with:
          name: hatch-desktop-windows-unsigned
          path: |
            desktop-app/src-tauri/target/debug/bundle/nsis/*.exe
            artifacts/desktop-uat/windows.json
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Build deployable containers
    runs-on: ubuntu-latest
    needs: [commerce, runtime, dashboard, desktop-renderer, desktop-native, desktop-native-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Runtime/Registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: false
          tags: hatch-runtime:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: hatch-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
