name: Hatch CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime and Registry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test

  desktop:
    name: Desktop renderer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test renderer
        run: npm run test:renderer
      - name: Build web target
        run: npm run build:web

  dashboard:
    name: Creator Dashboard tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: creator-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build portal
        run: npm run build

  containers:
    name: Build production containers
    runs-on: ubuntu-latest
    needs: [runtime, dashboard, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Runtime/Registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: false
          tags: hatch-runtime:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: hatch-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
