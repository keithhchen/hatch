name: Hatch Web CI

on:
  workflow_call:
  pull_request:
    paths:
      - "runtime-server/**"
      - "creator-dashboard/**"
      - "packages/**"
      - "Dockerfile.runtime"
      - "Dockerfile.dashboard"
      - "Dockerfile.caddy"
      - "compose*.yml"
      - "Caddyfile"
      - "scripts/create-agent-zip.mjs"
      - "scripts/commerce-v2-smoke.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/web.yml"
  push:
    branches: [master]
    paths:
      - "runtime-server/**"
      - "creator-dashboard/**"
      - "packages/**"
      - "Dockerfile.runtime"
      - "Dockerfile.dashboard"
      - "Dockerfile.caddy"
      - "compose*.yml"
      - "Caddyfile"
      - "scripts/create-agent-zip.mjs"
      - "scripts/commerce-v2-smoke.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce:
    name: Commerce ledger tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test cross-process ledger invariants
        run: npm test

  runtime:
    name: Runtime and Registry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test

  dashboard:
    name: Creator Dashboard tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            creator-dashboard/package-lock.json
            packages/ui/package-lock.json
      - name: Install shared UI dependencies
        working-directory: packages/ui
        run: npm ci
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build portal
        run: npm run build

  containers:
    name: Build deployable web containers
    needs: [commerce, runtime, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Runtime/Registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: false
          tags: hatch-runtime:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: hatch-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Build Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: false
          tags: hatch-caddy:ci
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
