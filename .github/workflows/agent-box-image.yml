name: Agent box image

# The sandbox image BoxLite boxes run (docker.io/keithchen/hatch-agent-box): built on GitHub's runners, never on a laptop.
on:
  push:
    paths:
      - infra/boxlite-agent/Dockerfile
      - .github/workflows/agent-box-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-box-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: keithchen
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tag
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: infra/boxlite-agent
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/keithchen/hatch-agent-box:latest
            docker.io/keithchen/hatch-agent-box:${{ steps.tag.outputs.date }}
            docker.io/keithchen/hatch-agent-box:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
