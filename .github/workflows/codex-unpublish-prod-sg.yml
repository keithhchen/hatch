name: Codex one-off unpublish production products

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpublish:
    name: Unpublish exact products on Singapore production
    runs-on: [self-hosted, linux, x64, hatch-prod]
    steps:
      - name: Remove live Registry pointers
        working-directory: /opt/hatch
        run: |
          set -euo pipefail
          test -f .env
          postgres_user="$(sed -n 's/^POSTGRES_USER=//p' .env | tail -n 1)"
          postgres_database="$(sed -n 's/^POSTGRES_DB=//p' .env | tail -n 1)"
          postgres_user="${postgres_user:-hatch}"
          postgres_database="${postgres_database:-hatch}"
          docker compose --env-file .env -f compose.infra.yml exec -T postgres psql \
            -v ON_ERROR_STOP=1 -X -A -F '|' -U "$postgres_user" -d "$postgres_database" <<'SQL'
          BEGIN;
          DO $$
          DECLARE
            matched integer;
            removed integer;
          BEGIN
            SELECT count(*) INTO matched
            FROM hatch_creator_products
            WHERE id IN (
              '026651b1-8a8a-4484-aac5-ace6bd662157',
              '4af0fe81-c9d7-4ff9-8365-01f0d664f633',
              'fd8a52cb-01be-4804-9f3b-6f1a0db603a5'
            );
            IF matched <> 3 THEN
              RAISE EXCEPTION 'guard: expected 3 exact products, found %', matched;
            END IF;

            SELECT count(*) INTO matched
            FROM hatch_creator_registry_live
            WHERE product_id IN (
              '026651b1-8a8a-4484-aac5-ace6bd662157'::uuid,
              '4af0fe81-c9d7-4ff9-8365-01f0d664f633'::uuid,
              'fd8a52cb-01be-4804-9f3b-6f1a0db603a5'::uuid
            );
            IF matched <> 3 THEN
              RAISE EXCEPTION 'guard: expected 3 live pointers, found %', matched;
            END IF;

            DELETE FROM hatch_creator_registry_live
            WHERE (product_id, creator_id) IN (
              ('026651b1-8a8a-4484-aac5-ace6bd662157'::uuid, '32ffccf7-893d-4ef3-bdbc-c82fc8fcb90b'::uuid),
              ('4af0fe81-c9d7-4ff9-8365-01f0d664f633'::uuid, '5c9dce5d-8365-4205-a5b8-4ae53e96ce81'::uuid),
              ('fd8a52cb-01be-4804-9f3b-6f1a0db603a5'::uuid, '5c9dce5d-8365-4205-a5b8-4ae53e96ce81'::uuid)
            );
            GET DIAGNOSTICS removed = ROW_COUNT;
            IF removed <> 3 THEN
              RAISE EXCEPTION 'guard: expected to remove 3 live pointers, removed %', removed;
            END IF;
          END $$;
          COMMIT;
          SQL

      - name: Verify public products are unavailable
        working-directory: /opt/hatch
        run: |
          set -euo pipefail
          domain="$(sed -n 's/^HATCH_DOMAIN=//p' .env | tail -n 1)"
          test -n "$domain"
          for product_id in \
            026651b1-8a8a-4484-aac5-ace6bd662157 \
            4af0fe81-c9d7-4ff9-8365-01f0d664f633 \
            fd8a52cb-01be-4804-9f3b-6f1a0db603a5; do
            status="$(curl -4 --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' "https://${domain}/v1/public/products/${product_id}")"
            test "$status" = 404 || { echo "public product ${product_id} returned HTTP ${status}" >&2; exit 1; }
          done
          echo 'verified: all three exact products are unavailable from public API'
