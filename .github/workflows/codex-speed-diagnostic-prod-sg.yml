name: Codex speed diagnostic production SG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, linux, x64, hatch-prod]
    steps:
      - name: Measure production from Singapore runner
        shell: bash
        run: |
          set -euo pipefail
          domain="$(sed -n 's/^HATCH_DOMAIN=//p' /opt/hatch/.env | tail -1)"
          echo "runner=$(hostname)"
          echo "domain=${domain}"
          for url in "https://${domain}/explore" "https://${domain}/studio" "https://${domain}/v1/public/products?limit=20"; do
            echo "=== ${url} ==="
            for i in 1 2 3 4 5; do
              curl -4 --noproxy '*' --max-time 20 -sS -o /dev/null \
                -w "sample=${i} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download} code=%{http_code}\n" \
                "${url}"
            done
          done

          echo "=== dashboard container direct ==="
          docker compose --env-file /opt/hatch/.env -f /opt/hatch/compose.app.yml exec -T dashboard node --input-type=module -e '
            const urls = ["http://127.0.0.1:8500/readyz", "http://127.0.0.1:8500/v1/public/products?limit=20"];
            for (const url of urls) {
              const samples = [];
              for (let i = 0; i < 5; i++) {
                const started = performance.now();
                const response = await fetch(url);
                await response.arrayBuffer();
                samples.push({ sample: i + 1, ms: Math.round(performance.now() - started), status: response.status });
              }
              console.log(url, JSON.stringify(samples));
            }
          '
