name: Windows sandbox compatibility probe (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Build and unit test isolated probe
        shell: pwsh
        run: |
          cargo test --locked --manifest-path tools/windows-sandbox-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path tools/windows-sandbox-probe/Cargo.toml
          exit $LASTEXITCODE
      - name: Prepare actual bundled Windows toolchain
        run: node desktop-app/scripts/prepare-runtime.mjs
      - name: Run independent compatibility experiments
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path probe-results -Force | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          @{ elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); os = [Environment]::OSVersion.VersionString; scope = 'CI compatibility probe; not standard-user Desktop UAT' } | ConvertTo-Json | Set-Content probe-results/host.json
          $probe = '.\\tools\\windows-sandbox-probe\\target\\release\\hatch-windows-sandbox-probe.exe'
          $runtime = (Resolve-Path desktop-app/src-tauri/runtime).Path
          & $probe --opt-in --runtime-root $runtime --mode lpac --timeout-seconds 180 1>probe-results/lpac.json 2>probe-results/lpac.stderr.txt
          $lpacExit = $LASTEXITCODE
          & $probe --opt-in --runtime-root $runtime --mode appcontainer --timeout-seconds 180 1>probe-results/appcontainer.json 2>probe-results/appcontainer.stderr.txt
          $appcontainerExit = $LASTEXITCODE
          @{ lpac = $lpacExit; appcontainer = $appcontainerExit } | ConvertTo-Json | Set-Content probe-results/exit-codes.json
          if ($lpacExit -ne 0 -or $appcontainerExit -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-sandbox-probe-evidence
          path: probe-results/
          if-no-files-found: warn
