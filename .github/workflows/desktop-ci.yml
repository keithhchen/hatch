name: Windows restricted identity probe (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Build and unit test isolated probe
        shell: pwsh
        run: |
          cargo test --locked --manifest-path tools/windows-sandbox-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path tools/windows-sandbox-probe/Cargo.toml
          exit $LASTEXITCODE
      - name: Prepare actual bundled Windows toolchain
        run: node desktop-app/scripts/prepare-runtime.mjs
      - name: Run dedicated restricted identity experiment
        shell: pwsh
        run: ./tools/windows-sandbox-probe/scripts/run-ci.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-sandbox-probe-evidence
          path: probe-results/
          if-no-files-found: warn
