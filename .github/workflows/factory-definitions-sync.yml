name: Hatch factory definitions sync

# Factory Agent definitions live in the Postgres table
# hatch_factory_agent_definitions (seeded once from prompts/factory-agents/*).
# Editing the prompt files does not update existing rows, so after a prompt
# change is deployed, refresh the definitions from the deployed image.
# Runs entirely inside the registry container: the image already carries the
# compiled definitions module and the prompt sources, and the production
# runner has no usable Node toolchain on the host.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync Factory Agent definitions on production
    runs-on: [self-hosted, linux, x64, hatch-prod]
    steps:
      - name: Refresh registry definitions from the deployed image
        working-directory: /opt/hatch
        run: |
          set -euo pipefail
          docker compose --env-file .env --env-file .release.env -f compose.app.yml exec -T registry node --input-type=module -e "
            const definitions = await import('file:///app/runtime-server/dist/factoryAgents/definitions.js');
            const agents = await definitions.initialAgentDefinitions();
            const response = await fetch('http://localhost:8100/v1/internal/factory-agent-definitions', {
              method: 'PUT',
              headers: { 'content-type': 'application/json', authorization: 'Bearer ' + process.env.HATCH_REGISTRY_DEPLOYMENT_SERVICE_TOKEN },
              body: JSON.stringify({ agents }),
            });
            const body = await response.text();
            console.log('registry responded', response.status, body.slice(0, 300));
            if (!response.ok) process.exit(1);
          "
