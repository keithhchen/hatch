name: Hatch infrastructure bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, x64, hatch-prod]
    steps:
      - name: Checkout source through GitHub API
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          archive="$temp_dir/source.tgz"
          curl -4 --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$archive"
          root_dir="$(tar -tzf "$archive" | sed -n '1s#/.*##p')"
          test -n "$root_dir"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          tar -xzf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/$root_dir/." "$GITHUB_WORKSPACE/"
          rm -rf "$temp_dir"
      - name: Materialize GitHub production environment
        env:
          HATCH_PRODUCTION_ENV: ${{ secrets.HATCH_PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          test -n "$HATCH_PRODUCTION_ENV"
          temp_env="$(mktemp /opt/hatch/.env.github.XXXXXX)"
          trap 'rm -f "$temp_env"' EXIT
          umask 077
          printf '%s\n' "$HATCH_PRODUCTION_ENV" > "$temp_env"
          test -s "$temp_env"
          grep -Eq '^HATCH_DOMAIN=[^[:space:]]+$' "$temp_env"
          chmod 600 "$temp_env"
          mv -f "$temp_env" /opt/hatch/.env
          trap - EXIT
      - name: Prepare infrastructure definition
        run: |
          set -euo pipefail
          install -m 640 compose.infra.yml /opt/hatch/compose.infra.yml
      - name: Start infrastructure only
        run: |
          set -euo pipefail
          cd /opt/hatch
          test -f .env
          for key in POSTGRES_PASSWORD; do
            grep -Eq "^${key}=[^[:space:]]+" .env || { echo "Missing non-empty $key in GitHub production environment"; exit 1; }
          done
          docker network inspect hatch_internal >/dev/null 2>&1 || docker network create hatch_internal
          docker compose --env-file .env -f compose.infra.yml up -d postgres qdrant
          docker compose --env-file .env -f compose.infra.yml ps --status running postgres qdrant
