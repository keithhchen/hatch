[package]
name = "hatch-local-runner"
version = "0.1.0"
edition = "2021"
description = "Sandbox-confined local runner core and CLI skeleton for Hatch"
license = "UNLICENSED"

[lib]
name = "hatch_local_runner"
path = "src/lib.rs"

[[bin]]
name = "hatch-local-runner"
path = "src/main.rs"

[dependencies]
calamine = "0.26"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
rust_xlsxwriter = "0.84"
tempfile = "3"
