[project]
name = "hatch-privacyd"
version = "0.1.0"
description = "Local privacy sidecar for Hatch MVP."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
]
opf = []

[project.scripts]
privacyd = "privacyd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacyd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
