name: hatch-app

services:
  registry:
    image: ${HATCH_IMAGE_PREFIX:-ghcr.io/example/hatch}/runtime:${HATCH_RELEASE_TAG:-dev}
    command: ["node", "dist/registryServer.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      REGISTRY_HOST: 0.0.0.0
      REGISTRY_PORT: 8100
      HATCH_REGISTRY_DATABASE_URL: ${HATCH_REGISTRY_DATABASE_URL:?set HATCH_REGISTRY_DATABASE_URL in /opt/hatch/.env}
      HATCH_AGENT_CORPUS_ROOT: /var/lib/hatch/corpora
      HATCH_QDRANT_URL: http://qdrant:6333
    volumes:
      - corpus_data:/var/lib/hatch/corpora
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  runtime:
    image: ${HATCH_IMAGE_PREFIX:-ghcr.io/example/hatch}/runtime:${HATCH_RELEASE_TAG:-dev}
    command: ["node", "dist/index.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      HATCH_RUNTIME_HOST: 0.0.0.0
      PORT: 8400
      HATCH_REGISTRY_URL: http://registry:8100
      HATCH_AGENT_CORPUS_ROOT: /var/lib/hatch/corpora
      HATCH_QDRANT_URL: http://qdrant:6333
      HATCH_LLM_PROFILE: ${HATCH_LLM_PROFILE:-deepseek-v4-flash}
      HATCH_COMMERCE_LEDGER_FILE: /var/lib/hatch/commerce/ledger.jsonl
      HATCH_OUTPUT_GUARD: ${HATCH_OUTPUT_GUARD:-enforce}
      HATCH_OUTPUT_GUARD_REGION: ${HATCH_OUTPUT_GUARD_REGION:-cn-shanghai}
      HATCH_OUTPUT_GUARD_ENDPOINT: ${HATCH_OUTPUT_GUARD_ENDPOINT:-green-cip-vpc.cn-shanghai.aliyuncs.com}
      HATCH_OUTPUT_GUARD_SERVICE: ${HATCH_OUTPUT_GUARD_SERVICE:-response_security_check_pro}
      ALIBABA_CLOUD_ECS_METADATA: ${ALIBABA_CLOUD_ECS_METADATA:-HatchRuntimeRole}
      ALIBABA_CLOUD_IMDSV1_DISABLE: ${ALIBABA_CLOUD_IMDSV1_DISABLE:-true}
    volumes:
      - corpus_data:/var/lib/hatch/corpora:ro
      - commerce_data:/var/lib/hatch/commerce
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8400/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    image: ${HATCH_IMAGE_PREFIX:-ghcr.io/example/hatch}/dashboard:${HATCH_RELEASE_TAG:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      HATCH_CREATOR_DASHBOARD_API_HOST: 0.0.0.0
      HATCH_CREATOR_DASHBOARD_API_PORT: 8500
      HATCH_REGISTRY_URL: http://registry:8100
      HATCH_COMMERCE_LEDGER_PATH: /var/lib/hatch/commerce/ledger.jsonl
    volumes:
      - commerce_data:/var/lib/hatch/commerce
    networks:
      - hatch_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8500/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: ${HATCH_IMAGE_PREFIX:-ghcr.io/example/hatch}/caddy:${HATCH_RELEASE_TAG:-dev}
    restart: unless-stopped
    environment:
      HATCH_DOMAIN: ${HATCH_DOMAIN:?set HATCH_DOMAIN in /opt/hatch/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hatch_internal
    depends_on:
      registry:
        condition: service_healthy
      runtime:
        condition: service_healthy
      dashboard:
        condition: service_healthy

volumes:
  corpus_data:
    name: hatch_corpus_data
  commerce_data:
    name: hatch_commerce_data
  caddy_data:
    name: hatch_caddy_data
  caddy_config:
    name: hatch_caddy_config

networks:
  hatch_internal:
    external: true
    name: hatch_internal
