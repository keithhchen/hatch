[project]
name = "hatch-platform-registry"
version = "0.1.0"
description = "Minimal Hatch Registry MVP service."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]

[project.scripts]
hatch-registry = "hatch_registry.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hatch_registry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
