[project]
name = "hatch-platform-registry"
version = "0.1.0"
description = "Minimal Hatch Registry MVP service."
requires-python = ">=3.11"
dependencies = [
  "alibabacloud-bailian20231229>=2.14.2",
  "alibabacloud-credentials>=1.0.10",
  "alibabacloud-tea-openapi>=0.3.13",
  "alibabacloud-tea-util>=0.3.13",
  "fastapi>=0.115.0",
  "jsonschema>=4.23.0",
  "referencing>=0.35.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]

[project.scripts]
hatch-registry = "hatch_registry.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hatch_registry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
