[package]
name = "hatch-windows-sandbox-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Explicit opt-in, temporary-directory-only Windows sandbox compatibility probe"

# Deliberately independent of Hatch/Tauri and its release build.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading",
  "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices"
] }
